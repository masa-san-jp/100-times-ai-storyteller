[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "100-times-ai-storyteller"
version = "0.0.1"
description = "Agent harness for autonomous story generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
st = "storyteller.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storyteller"]
