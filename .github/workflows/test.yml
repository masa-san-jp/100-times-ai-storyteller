name: Test

# ハーネスの完成までは、1つの環境で動くものを先に仕上げる。
# プルリクエスト・main への push・毎日の定時実行では ubuntu-latest / Python 3.11 の1ジョブだけを実行する。
# 3 OS × 2 版の全ジョブは手動の実行（workflow_dispatch）だけで行い、完成判定のときに流す。
# main で失敗したジョブがあれば Issue を起票する。
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.select.outputs.os }}
      python: ${{ steps.select.outputs.python }}
    steps:
      - id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'os=["macos-latest","ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python=["3.11","3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python=["3.11"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: select
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        python-version: ${{ fromJSON(needs.select.outputs.python) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check documentation
        run: uv run python tools/check_docs.py

      - name: Run tests
        run: uv run pytest

  report-failure:
    name: Report failure on main
    needs: test
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "CI 失敗：main（$EVENT_NAME、${SHA:0:7}）" \
            --body "main の CI で失敗したジョブがあります。

          - きっかけ：$EVENT_NAME
          - コミット：$SHA
          - 実行：$RUN_URL"
