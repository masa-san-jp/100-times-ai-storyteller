name: Windows claim diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - name: Repeat actual eight-executor test with traceback
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            Write-Output "Diagnostic iteration $attempt of 30"
            uv run pytest -q tests/test_claims.py::test_eight_executors_do_not_time_out_on_the_manifest_lock -k normal-disk
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
