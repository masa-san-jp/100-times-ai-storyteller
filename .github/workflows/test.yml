name: Windows claim diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        condition: [normal-disk, slow-disk]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - name: Repeat actual eight-executor test with traceback
        shell: pwsh
        env:
          TEST_CONDITION: ${{ matrix.condition }}
        run: |
          $repeatCount = if ($env:TEST_CONDITION -eq 'normal-disk') { 30 } else { 10 }
          for ($attempt = 1; $attempt -le $repeatCount; $attempt++) {
            Write-Output "Diagnostic $env:TEST_CONDITION iteration $attempt of $repeatCount"
            uv run pytest -q tests/test_claims.py::test_eight_executors_do_not_time_out_on_the_manifest_lock -k $env:TEST_CONDITION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
