id: S2.counter
version: 1
kind: llm
element: text
inputs:
  material:
    label: 素材
    from: S2.plan
    select: plans[{slot}].material
    required: true
  axis:
    label: 要素の軸
    from: S2.plan
    select: plans[{slot}].axis
    required: true
  cliches:
    label: 使わない表現
    from: S2.plan
    select: cliches.phrases
    required: true
    truncate: head
  previous_elements:
    label: 対極を作る対象の要素
    from: S2.expand
    select: previous
    required: true
output: text
card:
  role: 与えられた一つの素材と一つの要素の軸だけを手がかりに、具体的で意外性のある要素を作る。
  steps:
    - すでに書いた要素と対極にある要素を1件、10〜40字で、同じ軸の定義に沿って書く。対極は単なる反対語ではなく、素材に対する別の再構築にする。
    - 入力スロットの「使わない表現」に含まれる表現を使わない。
    - 入力にない人物・設定・固有名詞を付け加えない。
validate:
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 10
    - max_chars:
        n: 40
    - avoid_listed:
        table: tables/cliches.yaml
    - no_new_proper_nouns:
        mode: warn
share_across_runs: true
on_exhausted: skip
