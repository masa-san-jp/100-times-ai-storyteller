id: S5.profile
version: 2
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  name:
    label: 名前
    from: S5.name
    select: "[{slot}].name"
    required: true
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
output: json
card:
  role: 与えられた人物の割り当てだけを統合し、プロフィールを書く。
  steps:
    - 名前、役の定義、年齢、性別、種族、能力、願望、役割・課題を具体的に統合する。
    - 主人公には禁忌と抑圧されている自己像があれば反映し、他の人物には主人公の名前と役だけを文脈として反映する。
    - 入力にない出来事、場所、過去、人間関係、診断を付け加えず、300字以内で書く。
    - sources には使った入力のIDを記録する。
  output_example: '{"profile": "...", "sources": ["c1"]}'
validate:
  schema: schemas/tasks/S5.profile.schema.json
  checks:
    - min_chars:
        field: profile
        n: 1
    - sources_exist
    - max_chars:
        field: profile
        n: 300
max_input_chars: 3000
default_sources: ["{slot}"]
