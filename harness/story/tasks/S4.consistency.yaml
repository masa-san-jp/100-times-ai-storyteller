id: S4.consistency
version: 3
kind: llm
element: judgement
inputs:
  facts:
    label: 確定した事実（最大6行）
    from: S4.fact
    select: facts
    required: true
  section_body:
    label: 世界の描写
    from: S4.section
    select: '[{slot}].body'
    required: false
  item_body:
    label: 項目の描写
    from: S4.item
    select: '[{slot}].body'
    required: false
output: json
card:
  role: 確定した事実（最大6行）と描写が矛盾するか判定する。
  steps:
    - 各事実と描写の対象・属性を確かめ、同じ対象・属性の記述が両立しない場合だけ、answer を yes にする。数値・名称だけでなく制度・種類・成立条件の意味の食い違いも矛盾とする。
    - 種類が近いという理由で、別の行事・手続・対象を同一視しない。別対象の名称や数値が違っても、共存できれば矛盾ではない。
    - 今回の分割に対応する事実がない記述を、他の対象の事実で補って矛盾としない。
    - ただし、描写による明示的な同一視・否定・唯一性などで確定事実と両立しなくなる場合は矛盾とする。同じ対象の名称・数値の違い、制度・成立条件の意味違反も引き続き検査する。
    - 事実に言及していないこと、事実と両立する説明、未定の項目は矛盾にしない。矛盾がなければ answer を no にする。
    - reason に確定値と食い違う記述または両立する理由を1文で書く。入力にない事情を補って矛盾を解消しない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S4.consistency.schema.json
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        field: reason
        n: 1
    - max_chars:
        field: reason
        n: 160
max_input_chars: 2200
on_exhausted: skip
