id: S5.intro
version: 3
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
output: json
card:
  role: プロフィールと人物の文脈から、短い紹介を書く。
  steps:
    - 人物の役割、人物像、魅力が伝わる短い紹介を1つ書く。
    - world-building の short_introduction として、50字以内にする。
    - 入力にない設定を補わず、文末まで完結させる。
  output_example: '{"intro": "...", "sources": ["c1"]}'
validate:
  schema: schemas/tasks/S5.intro.schema.json
  checks:
    - min_chars:
        field: intro
        n: 1
    - sources_exist
    - ends_complete:
        field: intro
        fix: append
    - max_chars:
        field: intro
        n: 50
max_input_chars: 3000
default_sources: ["{slot}"]
