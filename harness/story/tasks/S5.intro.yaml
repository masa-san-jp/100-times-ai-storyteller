id: S5.intro
version: 6
kind: llm
inputs:
  facts:
    label: 人物の事実のシート
    from: S5.facts
    select: "[{slot}]"
    required: true
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: json
card:
  role: プロフィールと人物の文脈から、短い紹介を書く。
  steps:
    - 事実のシートに従い、年齢・生年・身長・出身地・居住地・所属・家族・年表・技能と矛盾させない。用語集 ID は対応する名前で表記し、事実にない数値や固有名詞を加えない。
    - 固有名詞は入力と用語集にあるものだけを使い、新しい名前や呼称を作らない。
    - 人物の役割、人物像、魅力が伝わる短い紹介を1つ書く。
    - world-building の short_introduction として、50字以内にする。
    - 入力にない設定を補わず、文末まで完結させる。
  output_example: '{"intro": "...", "sources": ["c1"]}'
validate:
  schema: schemas/tasks/S5.intro.schema.json
  checks:
    - no_new_proper_nouns:
        mode: fail
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        field: intro
        n: 1
    - sources_exist
    - ends_complete:
        field: intro
        fix: append
    - max_chars:
        field: intro
        n: 50
max_input_chars: 3000
default_sources: ["{slot}"]
