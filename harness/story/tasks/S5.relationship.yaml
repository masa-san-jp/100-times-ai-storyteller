id: S5.relationship
version: 5
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
  other_person:
    label: 相手の人物
    from: S5.relationship_context
    select: output
    required: true
    truncate: head
output: text
extend_to_min: true
card:
  role: 割り当てられた人物と、相手の人物の名前・役・紹介だけを使って、二人の関係を書く。
  steps:
    - 自分のプロフィールと、相手の人物の名前・役・紹介から、相手に対する関係・感情・距離感を具体的に書く。
    - 相手の人物にない属性や、二人の間の出来事を新たに付け加えない。
    - 300〜600字を目安に書く。
validate:
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 300
    - max_chars:
        n: 600
        fix: trim
max_input_chars: 2800
