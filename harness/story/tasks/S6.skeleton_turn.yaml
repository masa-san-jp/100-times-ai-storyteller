id: S6.skeleton_turn
version: 2
kind: llm
element: text
inputs:
  skeleton_ledger:
    label: 骨子の台帳
    from: S6.expand
    select: skeleton_ledger
    required: true
    truncate: none
  following_skeleton:
    label: この転換の直後に起きること
    from: S6.expand
    select: following_skeleton
    required: true
    truncate: none
  plot_items:
    label: プロットの型
    from: S6.expand
    select: plot_items
    required: true
    truncate: none
  required_event:
    label: 必須の出来事
    from: S6.expand
    select: required_event
    required: true
    truncate: none
  slot_characters:
    label: 割り当てた人物（名前・役）
    from: S6.expand
    select: slot_characters
    required: true
    truncate: none
  stage_definition:
    label: 段階の定義
    from: S6.expand
    select: stage_definition
    required: true
    truncate: none
  stage_guidance:
    label: 段階の指針
    from: S6.expand
    select: stage_guidance
    required: true
    truncate: none
  absent_role_note:
    label: 不在の役の注記
    from: S6.expand
    select: absent_role_note
    required: false
    truncate: none
  theme:
    label: 解決すべき主題
    from: S6.expand
    select: theme
    required: false
    truncate: none
  input_ledger:
    label: 入力の台帳
    from: S6.expand
    select: ledgers.input_ledger
    required: false
    truncate: head
  cast_ledger:
    label: 人物の台帳
    from: S6.expand
    select: ledgers.cast_ledger
    required: false
    truncate: head
  world_ledger:
    label: 世界の台帳
    from: S6.expand
    select: ledgers.world_ledger
    required: false
    truncate: head
output: text
card:
  role: 物語の骨子として、プロットの型の必須の出来事の1つを、この物語に固有の転換として書く。
  material_rule: 入力の台帳・人物・世界を参照し、この物語に固有の内容を書く。
  steps:
  - 必須の出来事を、割り当てた人物が何に直面し、何をして、何が変わるかとして、入力の台帳・人物・世界を参照して、この物語に固有の具体的な人物・物・出来事で書く。
  - この転換は、この転換の直後に起きることより前の時点にある。この時点では、直後に起きることはまだ起きていない。直後に起きることの原因・条件を、この時点でつくる出来事として書く。
  - 骨子の台帳にある、より後の転換と決定的な瞬間は、この転換が向かう先として参照する。
  - プロットの型の葛藤の種類と緩急の原則に従って書く。
  - 割り当てた人物が行う行動として書く。役が不在の場合は、不在の役の注記に従い、状況や内面の力として書く。
  - 2〜3文、200字以内で書く。
validate:
  checks:
  - max_chars:
      n: 200
  - ends_complete
  - no_new_proper_nouns:
      mode: warn
max_input_chars: 16000
on_exhausted: skip
continuation: false
