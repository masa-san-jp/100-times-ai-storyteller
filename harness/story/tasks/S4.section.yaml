id: S4.section
version: 1
kind: llm
inputs:
  section:
    label: 世界セクション
    from: S3.assign
    select: world_sections[{slot}]
    required: true
  place:
    label: 物語の場所
    from: S3.assign
    select: world.place
    required: true
  era:
    label: 物語の時代
    from: S3.assign
    select: world.era
    required: true
  plot_type:
    label: プロット型
    from: S3.assign
    select: threads[0].plot_type_name
    required: true
  prerequisite_sections:
    label: 前提セクション
    from: S4.section
    select: output
  prerequisite_items:
    label: 前提一覧項目
    from: S4.item
    select: output
output: json
card:
  role: 与えられた定義と観点だけを使って、世界セクションの本文を書く。
  steps:
    - 入力された世界セクションの定義と観点をすべて確認し、場所と時代に合う本文を400字以内で書く。
    - 入力されたプロット型の性質を背景として使い、観点にない設定や出来事を付け加えない。
    - 前提セクションがある場合は、その本文だけを踏まえて整合するように書く。前提一覧項目は名前と要約だけを使う。
    - 入力に含まれるIDを、本文の根拠としてsourcesに1件以上書く。本文は入力をそのまま引用せず、抽象的に解釈して再構成する。
  output_example: '{"body": "...", "sources": ["place:t1"]}'
validate:
  schema: schemas/tasks/S4.section.schema.json
  checks:
    - sources_exist
    - max_chars:
        field: body
        n: 400
    - no_new_proper_nouns:
        mode: warn
max_input_chars: 24000
