id: S4.section
version: 5
kind: llm
inputs:
  section:
    label: 世界セクションの定義
    from: S3.assign
    select: world_tasks[{slot}].section
    required: true
  viewpoint:
    label: 今回の観点
    from: S3.assign
    select: world_tasks[{slot}].viewpoint
    required: true
    truncate: head
  cut:
    label: 切り口の要素
    from: S3.assign
    select: world_tasks[{slot}].element
    required: true
  place:
    label: 物語の場所
    from: S3.assign
    select: world.place
    required: true
  era:
    label: 物語の時代
    from: S3.assign
    select: world.era
    required: true
  plot_type:
    label: プロット型
    from: S3.assign
    select: threads[0].plot_type_name
    required: true
  prerequisite_sections:
    label: 前提セクション
    from: S4.section
    select: output
    truncate: head
  prerequisite_items:
    label: 前提一覧項目
    from: S4.item
    select: output
    truncate: head
output: text
extend_to_min: true
card:
  role: 与えられた定義と観点だけを使って、世界セクションの本文を書く。
  steps:
    - 物語の place・era の要素や前提セクションの文を言い換えて書き始めない。観点と切り口から書き始める。
    - 入力された世界セクションの定義と今回の観点だけを確認し、切り口の要素を使って場所と時代に合う本文を800〜1500字で書く。
    - 入力されたプロット型の性質を背景として使い、今回の観点にない設定や出来事を付け加えない。
    - 前提セクションがある場合は、その本文だけを踏まえて整合するように書く。前提一覧項目は名前と要約だけを使う。
    - 前提セクションの文をそのまま写さず、切り口と今回の観点に合わせて再構成する。
    - 本文は入力をそのまま引用せず、抽象的に解釈して再構成する。
validate:
  checks:
    - min_chars:
        n: 800
    - max_chars:
        n: 1500
        fix: trim
    - no_new_proper_nouns:
        mode: warn
max_input_chars: 2800
