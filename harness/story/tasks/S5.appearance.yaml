id: S5.appearance
version: 5
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
output: text
extend_to_min: true
card:
  role: 割り当てられた属性とプロフィールから、人物の外見と魅力を書く。
  steps:
    - 年齢、性別、種族、体格、装いを具体的に含める。
    - 外見的な特徴だけでなく、その人物の魅力が伝わるようにする。
    - 400〜800字を目安に書き、入力にない属性を付け加えない。
validate:
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 400
    - max_chars:
        n: 800
        fix: trim
max_input_chars: 2800
