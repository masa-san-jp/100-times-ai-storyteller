id: S5.appearance
version: 9
kind: llm
element: text
inputs:
  facts:
    label: 人物の事実のシート
    from: S5.fact
    select: "[{slot}]"
    required: true
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: character
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: text
extend_to_min: true
card:
  role: 割り当てられた属性とプロフィールから、人物の外見と魅力を書く。
  steps:
    - 事実のシートに従い、年齢・生年・身長・出身地・居住地・所属・家族・年表・技能と矛盾させない。用語集 ID は対応する名前で表記し、事実にない数値や固有名詞を加えない。
    - 固有名詞は入力と用語集にあるものだけを使い、新しい名前や呼称を作らない。
    - 年齢、性別、種族、体格、装いを具体的に含める。
    - 外見的な特徴だけでなく、その人物の魅力が伝わるようにする。
    - 400〜800字を目安に書き、入力にない属性を付け加えない。
validate:
  checks:
    - no_new_proper_nouns:
        mode: fail
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 400
    - max_chars:
        n: 800
        fix: trim
max_input_chars: 2800
