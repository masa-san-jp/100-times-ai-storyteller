id: S5.values
version: 2
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
output: json
card:
  role: 割り当てられた属性とプロフィールから、人物が重んじる価値観を書く。
  steps:
    - その人物が何を正しいと考え、何を許せないとするか、判断の基準になる価値観を具体的に書く。
    - 願望・役割・課題のどれかと結び付け、理由が分かるようにする。
    - 400〜800字を目安にし、入力にない出来事や関係を付け加えない。sources には使った入力のIDを記録する。
  output_example: '{"values": "...", "sources": ["c1"]}'
validate:
  schema: schemas/tasks/S5.values.schema.json
  checks:
    - sources_exist
    - min_chars:
        field: values
        n: 400
    - max_chars:
        field: values
        n: 800
        fix: trim
max_input_chars: 3000
default_sources: ["{slot}"]
