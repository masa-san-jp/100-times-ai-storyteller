id: S7.detail
version: 8
kind: llm
element: text
inputs:
  when:
    label: 出来事のいつ
    from: S7.assemble
    select: "[{slot}].when"
    required: true
  where:
    label: 出来事のどこ
    from: S7.assemble
    select: "[{slot}].where"
    required: true
  who:
    label: 出来事の誰
    from: S7.assemble
    select: "[{slot}].who"
    required: true
  why:
    label: 出来事の理由
    from: S7.assemble
    select: "[{slot}].why"
    required: true
  intent:
    label: 出来事の意思
    from: S7.assemble
    select: "[{slot}].intent"
    required: true
  what:
    label: 出来事の行動
    from: S7.assemble
    select: "[{slot}].what"
    required: true
  result:
    label: 出来事の結果
    from: S7.assemble
    select: "[{slot}].result"
    required: true
  emotion:
    label: 出来事の感情
    from: S7.assemble
    select: "[{slot}].emotion"
    required: true
  beat:
    label: 場面の働き
    from: S6.expand
    select: slots[{slot}].beats[{beat}]
    required: true
  characters:
    label: 登場人物
    from: S6.expand
    select: slots[{slot}].characters
    required: true
    truncate: head
  world_sections:
    label: 選択された世界の抜粋
    from: S6.expand
    select: slots[{slot}].world_sections
    required: true
    truncate: head
  previous_scene:
    label: 同じ出来事の直前の場面の末尾（最大600字）
    from: S7.detail
    select: output
    required: false
    truncate: tail
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: text
extend_to_min: true
continuation: true
card:
  role: 出来事の一つの場面を、正本として説明的に詳述する。
  steps:
    - 固有名詞は入力と用語集にあるものだけを使い、新しい名前や呼称を作らない。
    - 出来事の when・where・who・why・intent・what・result・emotion を、入力された内容から正確に引き継ぐ。
    - 場面の働きの定義に従い、この場面で起きたことと人物の行動を三人称で具体的に説明する。
    - 登場人物の名前・役・紹介・口調と、選択された世界の抜粋だけを使う。入力にない人物、出来事、設定を加えない。
    - 同じ出来事の直前の場面がある場合は、その末尾から自然につなげる。他の出来事の場面は参照しない。
    - 小説の文体や会話中心の表現にせず、いつ・どこで・誰が・何をしたかが分かる正本の説明にする。
    - 1500〜2500字を目安に、場面の説明だけを完結した文章で書く。
validate:
  checks:
    - no_new_proper_nouns:
        mode: fail
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 1500
    - max_chars:
        n: 2500
        fix: trim
max_input_chars: 2800
