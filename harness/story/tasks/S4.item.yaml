id: S4.item
version: 8
kind: llm
inputs:
  facts:
    label: 今回の観点の事実
    from: S4.facts
    select: output
    required: true
  section:
    label: 世界セクションの定義
    from: S3.assign
    select: world_tasks[{slot}].section
    required: true
  cut:
    label: 切り口の要素
    from: S3.assign
    select: world_tasks[{slot}].element
    required: true
  name:
    label: 項目の名前
    from: S4.item_name
    select: "[{slot}].name"
    required: true
    truncate: head
  place:
    label: 物語の場所
    from: S3.assign
    select: world.place
    required: true
  era:
    label: 物語の時代
    from: S3.assign
    select: world.era
    required: true
  plot_type:
    label: プロット型
    from: S3.assign
    select: threads[0].plot_type_name
    required: true
  prerequisite_sections:
    label: 前提セクション
    from: S4.section
    select: output
    truncate: head
  prerequisite_items:
    label: 前提一覧項目
    from: S4.item
    select: output
    truncate: head
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: text
extend_to_min: true
card:
  role: 与えられた定義と観点だけを使って、一覧型世界セクションの1項目を書く。
  steps:
    - 事実と矛盾させない。事実にない数値・固有名詞を加えない。
    - 固有名詞は入力と用語集にあるものだけを使い、新しい名前や呼称を作らない。
    - 物語の place・era の要素や前提セクションの文を言い換えて書き始めない。観点と切り口から書き始める。
    - 入力された世界セクションの定義を確認し、切り口の要素を使って与えられた名前の項目の本文だけを書く。
    - 本文は600〜1200字とし、場所・時代・プロット型に合う具体性を持たせる。
    - 前提セクションがある場合は、その本文だけを踏まえて整合するように書く。前提一覧項目は名前と要約だけを使う。
    - 前提セクションの文をそのまま写さず、切り口に合わせて再構成する。
    - 本文は入力をそのまま引用せず、抽象的に解釈して再構成する。
validate:
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 600
    - max_chars:
        n: 1200
        fix: trim
    - no_new_proper_nouns:
        mode: fail
max_input_chars: 2800
