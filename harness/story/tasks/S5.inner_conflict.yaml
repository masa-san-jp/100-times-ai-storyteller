id: S5.inner_conflict
version: 1
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
output: json
card:
  role: 割り当てられた属性とプロフィールから、人物が抱える内面の自己矛盾や葛藤を書く。
  steps:
    - 願望と役割・課題、または禁忌や抑圧されている自己像が入力されていれば、それらの間で相容れない点を具体的に書く。
    - その矛盾が、本人にどのような迷いや苦しさとして現れるかを書く。
    - 500〜1000字を目安にし、入力にない出来事や関係を付け加えない。sources には使った入力のIDを記録する。
  output_example: '{"inner_conflict": "...", "sources": ["c1"]}'
validate:
  schema: schemas/tasks/S5.inner_conflict.schema.json
  checks:
    - sources_exist
    - min_chars:
        field: inner_conflict
        n: 500
    - max_chars:
        field: inner_conflict
        n: 1000
max_input_chars: 3000
default_sources: ["{slot}"]
