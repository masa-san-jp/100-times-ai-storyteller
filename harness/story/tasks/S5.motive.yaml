id: S5.motive
version: 4
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  name:
    label: 名前
    from: S5.name
    select: "[{slot}].name"
    required: true
    truncate: head
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  other_characters:
    label: 他の人物の役
    from: S3.assign
    select: cast
    required: false
    truncate: drop
  names:
    label: 人物の名前
    from: S5.name
    select: output
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
  protagonist_intro:
    label: 主人公の紹介
    from: S5.intro
    select: "[c1].intro"
    required: false
    truncate: head
output: json
card:
  role: 人物のプロフィールと周囲の人物から、その人物の動機を書く。
  steps:
    - 名前、役、プロフィール、他の人物の名前と役の関係から、動機を1つ書く。
    - 主人公には抑圧されている自己像が入力されていれば、それを動機の緊張として反映する。
    - プロット型の人物要件と、非主人公の場合に与えられた主人公の名前・役・紹介に沿い、120字以内で書く。
    - 入力にない過去や関係を付け加えず、sources には使った入力のIDを記録する。
  output_example: '{"motive": "...", "sources": ["c1"]}'
validate:
  schema: schemas/tasks/S5.motive.schema.json
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        field: motive
        n: 1
    - sources_exist
    - max_chars:
        field: motive
        n: 120
max_input_chars: 3000
default_sources: ["{slot}"]
