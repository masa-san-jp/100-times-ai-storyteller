id: S8.detail
version: 7
kind: llm
element: judgement
output: json
inputs:
  event:
    label: この出来事の確定事項
    from: S7.assemble
    select: '[{slot}]'
    required: true
  body:
    label: 検査する本文
    from: S7.detail
    select: body
    required: false
  previous:
    label: 直前の場面の末尾
    from: S7.detail
    select: previous
    required: false
    truncate: tail
card:
  role: 場面の本文が出来事と事実として両立するかを検査する。
  steps:
  - 出来事の行動・結果と本文、直前の場面の末尾が、事実として両立しないかだけを検査する。未定は対象外。
  - 矛盾とは事実として両立しないことだけを指す（同じ人物が同時に別の場所にいる、確定した結果を理由なく覆す、存在しないはずの人物・物が現れる、など）。心情・関係・状況の変化や展開は矛盾でない。非言及は否定ではなく、それだけを矛盾にしない。
  - 構造説明・内部 ID が本文にあれば検査する。
  - 矛盾なら answer=yes、他は no。reason は食い違いを具体的に1文で示す。入力外は補わない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 3500
max_output_tokens: 2048
