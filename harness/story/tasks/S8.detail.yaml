id: S8.detail
version: 2
kind: llm
element: judgement
output: json
inputs:
  event:
    label: この出来事の確定事項
    from: S7.assemble
    select: '[{slot}]'
    required: true
  body:
    label: 検査する本文
    from: S7.detail
    select: body
    required: false
  previous:
    label: 直前の場面（再演しない）
    from: S7.detail
    select: previous
    required: false
    truncate: tail
card:
  role: この場面の本文だけを検査する。
  steps:
  - 確定した出来事・筋の条件を追加・反転・置換しているか、直前の場面の行動や結果を進展なく再演しているかを検査する。未定の条件は判定しない。
  - 条件と本文の前提・行動・帰結および前後関係を照合する。同じ前後関係を逆転と判定しない。固定条件には実施済みの行動・結果がなく、条件を満たしたことだけでは再演にならない。再演は直前の実施済み場面の行動・結果と照合する。
  - 構造の説明と内部 ID が本文にないかも検査する。
  - いずれかに該当すれば answer は yes、なければ no。reason は根拠を1文で書き、yes の場合は入力で実際に食い違う前提・行動・帰結・前後関係、または進展なく再演した行動・結果を具体的に示す。入力にない事情を補わない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 3500
