id: S8.detail
version: 3
kind: llm
element: judgement
output: json
inputs:
  event:
    label: この出来事の確定事項
    from: S7.assemble
    select: '[{slot}]'
    required: true
  body:
    label: 検査する本文
    from: S7.detail
    select: body
    required: false
  previous:
    label: 直前の場面（再演しない）
    from: S7.detail
    select: previous
    required: false
    truncate: tail
card:
  role: この場面の本文だけを検査する。
  steps:
  - 確定した出来事・条件の追加・反転・置換を検査する。前提・行動・帰結・前後関係を照合し、同じ前後関係を逆転と判定しない。未定の条件は判定しない。
  - 条件は実施済みの場面ではなく、適合だけでは再演にならない。直前の場面の行動・結果の進展ない再演を検査する。
  - 非言及は否定ではなく、それだけを矛盾にしない。前提→帰結から逆や唯一の必要条件を導かない。明示された禁止・必要条件・前後関係の追加・反転・置換は yes とする。
  - 構造の説明・内部 ID も検査する。
  - 違反なら answer は yes、なければ no。reason は入力で食い違う前提・行動・帰結・順序か、進展ない再演の行動・結果を1文で具体的に示す。入力にない事情を補わない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 3500
