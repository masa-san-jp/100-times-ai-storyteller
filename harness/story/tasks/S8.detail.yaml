id: S8.detail
version: 4
kind: llm
element: judgement
output: json
inputs:
  event:
    label: この出来事の確定事項
    from: S7.assemble
    select: '[{slot}]'
    required: true
  body:
    label: 検査する本文
    from: S7.detail
    select: body
    required: false
  previous:
    label: 直前の場面（再演しない）
    from: S7.detail
    select: previous
    required: false
    truncate: tail
card:
  role: 本文を検査。
  steps:
  - 確定事項の追加・反転・置換は違反。前提・行動・帰結・順序を照合。同じ前後関係を逆転と判定しない。未定は対象外。
  - 条件適合は再演でない。直前の場面の行動・結果の進展ない再演を検査。
  - 非言及は否定ではなく、それだけを矛盾にしない。前提→帰結から逆や唯一の必要条件を導かない。明示された禁止・必要条件・前後関係の追加・反転・置換は yes とする。
  - 構造説明・内部 ID も検査。
  - 例：「押すと灯る」に「灯った」だけ／「押した」だけは no。押さなかった・灯らなかったと補わない。他の違反・再演も検査。
  - 違反なら answer=yes、なければ no。reason は食い違う前提・行動・帰結・順序か再演の行動・結果を具体的に1文。入力外は禁止。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 3500
