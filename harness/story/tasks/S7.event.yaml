id: S7.event
version: 1
kind: llm
inputs:
  stage_definition:
    label: 段階の定義
    from: S6.expand
    select: slots[{slot}].stage.definition
    required: true
  stage_guidance:
    label: 段階の指針
    from: S6.expand
    select: slots[{slot}].stage.guidance
    required: true
  required_events:
    label: 必須の出来事
    from: S6.expand
    select: slots[{slot}].required_events
    required: true
  absent_role_note:
    label: 不在の役の注記
    from: S6.expand
    select: slots[{slot}].absent_role_note
    required: true
  object:
    label: 象徴的な事物
    from: S6.expand
    select: slots[{slot}].object
    required: true
  characters:
    label: 割り当て人物
    from: S6.expand
    select: slots[{slot}].characters
    required: true
  world_sections:
    label: 選択された世界セクション
    from: S6.expand
    select: slots[{slot}].world_sections
    required: true
  previous_result:
    label: 同じ筋の直前の出来事の結果
    from: S8.judge
    select: output
    required: false
  conflict:
    label: 筋の葛藤
    from: S6.expand
    select: slots[{slot}].plot.conflict
    required: true
  climax:
    label: 筋のクライマックス
    from: S6.expand
    select: slots[{slot}].plot.climax
    required: false
  theme:
    label: 解決すべき主題
    from: S6.expand
    select: slots[{slot}].theme
    required: true
output: json
candidates: 1
card:
  role: 与えられた段階と局所的な文脈だけを使って、1つの出来事を書く。
  steps:
    - 段階の定義と指針に従い、必須の出来事があればそれを満たす1つの出来事を組み立てる。
    - 割り当て人物のID・名前・役・動機、選択された世界セクション、直前の結果だけを使い、入力にない人物や出来事を加えない。
    - 不在の役の注記と象徴的な事物を反映する。クライマックスの条件が入力にある場合だけ、それと葛藤を反映し、解決すべき主題との関係を示す。
    - why・where・when は、この出来事に固有の内容にし、人物の動機をそのまま書き写さない。
    - when・where・who・why・intent・what・result・emotion・foreshadowing をそれぞれ120字以内で書く。
    - sources には使った入力のIDを1件以上記録し、who には割り当て人物のIDだけを書く。
  output_example: '{"when":"...","where":"...","who":["c1"],"why":"...","intent":"...","what":"...","result":"...","emotion":"...","foreshadowing":"...","sources":["c1"]}'
validate:
  schema: schemas/tasks/S7.event.schema.json
  checks:
    - sources_exist
    - ids_subset:
        field: who
        slot: characters
    - max_chars:
        field: when
        n: 120
    - max_chars:
        field: where
        n: 120
    - max_chars:
        field: why
        n: 120
    - max_chars:
        field: intent
        n: 120
    - max_chars:
        field: what
        n: 120
    - max_chars:
        field: result
        n: 120
    - max_chars:
        field: emotion
        n: 120
    - max_chars:
        field: foreshadowing
        n: 120
    - no_new_proper_nouns:
        mode: warn
max_input_chars: 5000
max_invalidations: 2
