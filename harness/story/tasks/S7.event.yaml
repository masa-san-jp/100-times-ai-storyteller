id: S7.event
version: 22
kind: llm
element: text
inputs:
  skeleton_ledger:
    label: 骨子の台帳
    from: S6.expand
    select: skeleton_ledger
    required: true
    truncate: none
  realizing_skeleton:
    label: この出来事で実現する骨子
    from: S6.expand
    select: realizing_skeleton
    required: false
    truncate: none
  next_skeleton:
    label: 次に向かう骨子
    from: S6.expand
    select: next_skeleton
    required: false
    truncate: none
  stage_definition:
    label: 段階の定義
    from: S6.expand
    select: slots[{slot}].stage.definition
    required: true
    truncate: none
  stage_guidance:
    label: 段階の指針
    from: S6.expand
    select: slots[{slot}].stage.guidance
    required: true
    truncate: none
  time_design:
    label: プロットの型の時間の設計
    from: S6.expand
    select: slots[{slot}].plot.time_design
    required: true
    truncate: none
  pacing:
    label: プロットの型の緩急の原則
    from: S6.expand
    select: slots[{slot}].plot.pacing
    required: true
    truncate: none
  characters:
    label: 割り当て人物
    from: S6.expand
    select: slots[{slot}].characters
    required: true
    truncate: none
  event_field:
    label: 生成する項目
    from: S6.expand
    select: event_field
    required: true
  decided_fields:
    label: 先に決まった項目
    from: S7.event
    select: output
    required: false
    truncate: none
  event_ledger:
    label: これまでの出来事の台帳
    from: S6.expand
    select: event_ledger
    required: false
    truncate: tail
  cast_ledger:
    label: 人物の台帳
    from: S6.expand
    select: ledgers.cast_ledger
    required: false
    truncate: head
  world_sections:
    label: 選択された世界セクション
    from: S6.expand
    select: slots[{slot}].world_sections
    required: false
    truncate: head
  world_ledger:
    label: 世界の台帳
    from: S6.expand
    select: ledgers.world_ledger
    required: false
    truncate: head
output: text
candidates: 3
select_candidate: least_similar
card:
  material_rule: 骨子・これまでの出来事・人物・世界を参照し、この出来事を具体的に書く。
  role: 骨子とこれまでの出来事から、指定された出来事の項目1つだけを書く。
  steps:
  - 骨子と、これまでの出来事に続く、この出来事を書く。確定した人物・世界・出来事と矛盾させない。
  - what：誰が入力素材をどう扱うか、当段階の具体的行動を書く。段階の達成宣言だけにしない。既存素材への観察・扱い・照合・選択などを構成できる。実現する骨子が示されていれば、それをこの出来事の行動と結果として起こす。次に向かう骨子が示されていれば、そこへ因果でつながる行動と結果にする。冒頭を割り当て人物名＋は・がの主語にする。共同主語は割り当て人物名をと・、でつなぐ。ほかの人物への言及はできるが主語を置き換えない。 書式例「甲は箱の留め金を外す。」今の行動だけを書く。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - where：この出来事が起きる場所・位置だけを書く。完了した行動と結果全体を再述しない。 書式例「作業台の右端。」のように、場所を示す短い句を書く。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - when：この出来事の時点・時間的な関係だけを書く。完了した行動と結果全体を再述しない。 書式例「夕方の鐘が鳴った直後。」のように、時点を示す短い句を書く。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - why：先に決まった行動を引き起こす原因だけを書く。人物の動機をそのまま写さず、完了した行動と結果全体を再述しない。 書式例「留め金が引っかかっていたため。」のように、その行動の直接の原因だけを書く。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - intent：行動前に人物が目指すことだけを書く。達成済みの変化にせず、完了した行動と結果全体を再述しない。 書式例「箱の内側を確かめたい。」のように、まだ達成していない目標を書く。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - result：既決行動の後、入力のどれがどう変わったか具体的に書く。段階の達成宣言だけにしない。実現する骨子が示されていれば、それをこの出来事の行動と結果として起こす。次に向かう骨子が示されていれば、そこへ因果でつながる行動と結果にする。冒頭を割り当て人物名＋は・がの主語にする。共同主語は割り当て人物名をと・、でつなぐ。ほかの人物への言及はできるが主語を置き換えない。 書式例「甲は箱の内側が見える状態になった。」変化だけを書き、行動を再述しない。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - emotion：この出来事を受けた人物の感情状態だけを書く。完了した行動と結果全体を再述しない。 書式例「安堵と戸惑いが混じる。」のように、感情状態を短く書く。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - foreshadowing：入力の物・言葉・状態に基づく未解消の手がかりだけを書く。入力にない将来の出来事を断定せず、完了した行動と結果全体を再述しない。 書式例「留め金の裏に残る小さな傷。」のように、今ある未解消の手がかりを書く。将来の人物の行動や発見を書かない。書式だけの例であり、例の素材を本文に持ち込まず、入力内の素材だけを使う。
  - 指定項目の回答範囲だけを書く。先に決まった項目は矛盾防止の前提であり、全文の再述指示ではない。
  - 「生成する項目」の本文だけを1〜120字で書く。他項目・項目名・説明は出力しない。
validate:
  checks:
  - no_story_metadata
  - event_subject
  - no_repeated_event_field
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      n: 1
  - max_chars:
      n: 120
  - no_new_proper_nouns:
      mode: warn
max_input_chars: 16000
max_invalidations: 2
continuation: false
