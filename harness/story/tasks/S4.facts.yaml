id: S4.facts
version: 2
kind: llm
element: labeled
inputs:
  section:
    label: 世界セクションの定義
    from: S3.assign
    select: world_fact_tasks[{slot}].section
    required: true
  viewpoint:
    label: 今回の観点
    from: S3.assign
    select: world_fact_tasks[{slot}].viewpoint
    required: true
    truncate: head
  fact_schema:
    label: 事実の出力スキーマ
    from: S3.assign
    select: world_fact_tasks[{slot}].fact_schema
    required: true
  name_sound:
    label: 固有名詞の名前の響き
    from: S3.assign
    select: world_fact_tasks[{slot}].name_sound
    required: true
  place:
    label: 物語の場所
    from: S3.assign
    select: world.place
    required: true
  era:
    label: 物語の時代
    from: S3.assign
    select: world.era
    required: true
  name:
    label: 項目の名前
    from: S4.item_name
    select: "[{slot}].name"
    required: false
  prerequisite_facts:
    label: 前提セクションの事実
    from: S4.facts
    select: output
    required: false
    truncate: head
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: json
card:
  role: 与えられた観点について、数値・単位・年代を明示した世界の事実を定める。
  steps:
    - 今回の観点だけを扱い、場所・時代・前提の事実と矛盾しない客観的な事実を書く。
    - 事実の出力スキーマに従う。各行に名前、数値、単位、年、暦、件数を記す。「多い」「古い」などの程度語で数値や年を埋めない。
    - 地理は面積・標高・距離・季節ごとの気温や降水量・資源の産出量、社会は権限・構成員数・条文番号・通貨や暦、歴史は年・原因・結果、人々は人口・年齢構成・職業分布・言語のうち、今回の観点に該当する項目だけを具体化する。
    - 一覧項目の名前が与えられている場合はその項目の年・規模・構成・所属を定める。
    - 新しい固有名詞は与えられた音の2個以上から組み立て、glossary に名前・カタカナの読み・種類・1文の定義を記す。既存の名前は入力と用語集の表記を使う。
    - 名前の響きや出力スキーマなど、作り方の指示は事実に書かない。
  output_example: '{"facts": [{"name": "...", "value": 0, "unit": "...", "year": 0, "calendar": "...", "count": 0}], "glossary": [{"name": "...", "reading": "...", "kind": "...", "definition": "..."}]}'
validate:
  schema: schemas/tasks/S4.facts.schema.json
  checks:
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
max_input_chars: 3000
