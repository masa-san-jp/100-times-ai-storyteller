id: S5.personality
version: 4
kind: llm
inputs:
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  profile:
    label: プロフィール
    from: S5.profile
    select: "[{slot}].profile"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
output: text
extend_to_min: true
card:
  role: 割り当てられた属性とプロフィールから、人物の性格を書く。
  steps:
    - 願望・能力・役割・課題から読み取れる気質や物事への向き合い方を、具体的な場面での振る舞いが想像できるように書く。
    - 長所だけでなく、短所や癖も1つ以上含める。
    - 500〜1000字を目安にし、入力にない出来事や関係を付け加えない。
validate:
  checks:
    - min_chars:
        n: 500
    - max_chars:
        n: 1000
        fix: trim
max_input_chars: 2800
