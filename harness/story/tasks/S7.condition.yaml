id: S7.condition
version: 2
kind: llm
element: text
output: text
inputs:
  condition_kind:
    label: 確定する条件1つ
    from: S6.expand
    select: condition_kind
    required: true
  object:
    label: 対象の事物
    from: S3.assign
    select: world.object
    required: true
  world_sections:
    label: 局所的な世界の抜粋
    from: S6.expand
    select: slots[{slot}].world_sections
    required: true
    truncate: head
  conflict:
    label: 葛藤
    from: S6.expand
    select: slots[{slot}].plot.conflict
    required: true
  taboo:
    label: 主人公の禁忌
    from: S3.assign
    select: cast[0].elements.taboo
    required: true
  decided_conditions:
    label: 先に確定した条件（変更しない）
    from: S7.condition
    select: output
    required: false
card:
  role: 指定された筋の条件1つを確定する。
  material_rule: 入力にない人物・物・設定・事実を加えない。入力の素材から、指定された条件の前提と帰結を具体化してよい。
  steps:
  - 対象の事物・世界・葛藤・禁忌から、指定された条件1つだけを具体的に書く。
  - 先に確定した条件を変更・反転・置換せず、それと両立させる。その全文を別種類の条件として再述しない。同じ行為を含んでも、指定された条件の役割を区別する。
  - trigger：行為・状態を前提とする作用の帰結だけを1文で書く。発動を禁止や葛藤の解決に置き換えない。独立した書式例「押すと灯る」の人物・物・設定は素材に持ち込まない。
  - prohibition：禁じる行為を明示し、違反したときの帰結だけを1文で書く。禁止を単なる発動や解決の条件に置き換えない。独立した書式例「踏んではならず、踏むと崩れる」の人物・物・設定は素材に持ち込まない。
  - resolution：葛藤の解決が成立する前提と解決の帰結だけを1文で書く。解決を単なる発動や禁止に置き換えない。独立した書式例「揃えると争いが収まる」の人物・物・設定は素材に持ち込まない。
  - 本文だけを160字以内で書く。内部 ID や構造の説明を書かない。
validate:
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - no_story_metadata
  - min_chars:
      n: 1
  - max_chars:
      n: 160
max_input_chars: 2800
on_exhausted: skip
