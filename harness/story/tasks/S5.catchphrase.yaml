id: S5.catchphrase
version: 7
kind: llm
element: text
inputs:
  facts:
    label: 人物の事実のシート
    from: S5.facts
    select: "[{slot}]"
    required: true
  character:
    label: 割り当てられた人物
    from: S3.assign
    select: cast[{slot}]
    required: true
  motive:
    label: 動機
    from: S5.motive
    select: "[{slot}].motive"
    required: true
    truncate: head
  role_definition:
    label: 役の定義
    from: S3.assign
    select: cast[{slot}].role_definition
    required: true
  plot_requirements:
    label: プロット型の人物要件
    from: S3.assign
    select: cast[{slot}].plot_context
    required: true
  protagonist_name:
    label: 主人公の名前
    from: S5.name
    select: "[c1].name"
    required: false
    truncate: head
  protagonist_role:
    label: 主人公の役
    from: S3.assign
    select: cast[c1].role
    required: false
  protagonist_intro:
    label: 主人公の紹介
    from: S5.intro
    select: "[c1].intro"
    required: false
    truncate: head
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: text
card:
  role: 人物の動機と役割にふさわしい決め台詞を書く。
  steps:
    - 事実のシートに従い、年齢・生年・身長・出身地・居住地・所属・家族・年表・技能と矛盾させない。用語集 ID は対応する名前で表記し、事実にない数値や固有名詞を加えない。
    - 固有名詞は入力と用語集にあるものだけを使い、新しい名前や呼称を作らない。
    - 一人称で始まる1文を1つ書く。
    - 人物の口調、役割、動機が伝わる台詞にし、入力にない設定を付け加えず、文末まで完結させる。
validate:
  checks:
    - no_new_proper_nouns:
        mode: fail
    - no_copy_from_inputs
    - avoid_listed:
        table: tables/meta_terms.yaml
    - min_chars:
        n: 1
    - ends_complete:
        fix: append
max_input_chars: 3000
continuation: false
