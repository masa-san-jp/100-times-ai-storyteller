id: S8.compare
version: 14
kind: llm
element: judgement
inputs:
  comparison_kind:
    label: 比較の種類（conditions は固定条件、events は過去の出来事）
    from: S8.plan
    select: '[{slot}].targets[{slot}].comparison_kind'
    required: true
  event_a:
    label: 記述A
    from: S8.plan
    select: '[{slot}].targets[{slot}]'
    required: true
  event_b:
    label: 記述B
    from: S8.plan
    select: '[{slot}].current'
    required: true
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: json
card:
  role: 矛盾と再演を検査。
  steps:
  - conditions のAは固定条件、events のAは過去の出来事。
  - conditions はAの前提・行動・帰結とBを照合。条件を追加・反転・置換すれば yes。条件は未実施、適合は再演でない。未定は除外。
  - 禁止は能力の不存在を意味しない。能力・可能性は実施・許可・禁止解除でない。意思・条件引用も実施でない。実施の併記は検査、帰結の非言及でも違反は yes。明示許可・禁止解除は条件反転で yes。例：「開く禁止」に能力獲得だけは no、開いた／許可への変更は yes。例を素材・理由に使わない。
  - 非言及は否定ではなく、それだけを矛盾にしない。前提→帰結から逆や唯一の必要条件を導かない。明示された禁止・必要条件・前後関係の追加・反転・置換は yes とする。
  - 矛盾は事実として両立しないことだけを指す（同一人物の同時の別場所、確定結果の理由なき反転、存在しないはずの人物・物など）。心情・関係・状況の変化や展開は矛盾でない。
  - 入力にない同時性・同一場面・全人物の必須参加を補わない。人物・場所・時の差だけでは事実の矛盾でない。
  - events では矛盾と再演を別に判定する。同じ行動と結果を進展なく繰り返す場合も yes。共同主体から一部主体への変更・言い換えだけで免除しない。入力が独立した別人物・別場所・別時の出来事を示す場合や結果が進展する場合は再演としない。主体差だけから独立性を補わない。 例：同じ朝の書庫で、Aは甲と乙が帳簿を開き記録を発見し、Bは乙が同じ帳簿で同じ記録を発見しただけなら、主体差があっても再演で yes。
  - 矛盾・進展ない再演は answer=yes、他は no。
  - reason はA/Bの食い違う前提・行動・結果か再演を具体的に1文。
  - 入力外は補わない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 2800
