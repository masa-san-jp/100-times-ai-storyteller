id: S8.compare
version: 9
kind: llm
element: judgement
inputs:
  comparison_kind:
    label: 比較の種類（conditions は固定条件、events は過去の出来事）
    from: S8.plan
    select: '[{slot}].targets[{slot}].comparison_kind'
    required: true
  event_a:
    label: 記述A
    from: S8.plan
    select: '[{slot}].targets[{slot}]'
    required: true
  event_b:
    label: 記述B
    from: S8.plan
    select: '[{slot}].current'
    required: true
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: json
card:
  role: 与えられた記述と確定条件の矛盾、出来事の再演を確認する。
  steps:
  - 最初に比較の種類を確認する。conditions なら記述Aは固定条件、events なら記述Aは過去の出来事である。
  - conditions では、記述Aの前提・行動・帰結を記述Bと照合し、条件を追加・反転・置換していれば yes とする。固定条件には実施済みの行動・結果がなく、条件に従った記述Bを再演とは判定しない。未定の条件は判定しない。
  - 非言及は否定ではなく、それだけを矛盾にしない。前提→帰結から逆や唯一の必要条件を導かない。明示された禁止・必要条件・前後関係の追加・反転・置換は yes とする。
  - events では、同じ行動と結果を進展なく繰り返す場合も yes とする。時や場所が変わる、または結果が進展する場合は繰り返しとしない。
  - 矛盾とは、2つの記述が事実として両立しないことだけを指す（同じ人物が同時に別の場所にいる、記述Aで確定した結果を記述Bが理由なく覆す、存在しないはずの人物・物が現れる、など）。人物の心情・関係・状況の変化や展開は矛盾に含めない。
  - 入力にない同時性・同一場面・全人物の必須参加を補わない。人物・場所・時が異なるだけでは事実の矛盾にならない。conditions では条件との食い違い、events では事実の矛盾と進展のない再演を判定する。
  - 矛盾または進展のない再演があれば answer を yes、なければ no にする。
  - reason は判定理由を1文で書く。yes の場合は入力で実際に食い違う前提・行動・結果、または進展なく再演した行動・結果を具体的に示す。
  - 入力にない出来事や事情を付け加えない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 2800
