id: S8.compare
version: 15
kind: llm
element: judgement
inputs:
  event_a:
    label: 記述A
    from: S8.plan
    select: '[{slot}].targets[{slot}]'
    required: true
  event_b:
    label: 記述B
    from: S8.plan
    select: '[{slot}].current'
    required: true
  glossary:
    label: 関係する用語集
    from: S3.assign
    select: glossary
    required: false
    truncate: head
output: json
card:
  role: 出来事どうしが事実として両立するかを検査する。
  steps:
  - 記述Aは過去の出来事、記述Bは現在の出来事。
  - 矛盾とは、2つの記述が事実として両立しないことだけを指す（同じ人物が同時に別の場所にいる、記述Aで確定した結果を記述Bが理由なく覆す、存在しないはずの人物・物が現れる、など）。人物の心情・関係・状況の変化や展開は矛盾に含めない。
  - 入力にない同時性・同一場面・全人物の必須参加を補わない。人物・場所・時が異なるだけでは事実の矛盾でない。
  - 矛盾なら answer=yes、他は no。
  - reason は、入力で実際に食い違う前提・行動・結果を具体的に1文で示す。入力外は補わない。
  output_example: '{"answer": "...", "reason": "..."}'
validate:
  schema: schemas/tasks/S8.compare.schema.json
  checks:
  - no_copy_from_inputs
  - avoid_listed:
      table: tables/meta_terms.yaml
  - min_chars:
      field: reason
      n: 1
max_input_chars: 2800
