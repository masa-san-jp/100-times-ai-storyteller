axes:
  - key: want
    name: 願望
    definition: 人物が手に入れたい状態や、満たしたい欠落を表す要素。
    generation_rules:
      - 具体的な相手・場所・物・期限の少なくとも一つを含める。
      - 身体的・精神的・社会的・超越的な観点を散らし、表層的な願いから深い欠落まで幅を持たせる。
  - key: ability
    name: 能力
    definition: 人物が持つ特有の力や、状況に働きかける方法を表す要素。
    generation_rules:
      - 平凡な得意なことから特殊な力まで、身体的・精神的・社会的・特殊な観点を散らす。
      - 特別な力には発動条件と制約を持たせ、既視感のある力だけにしない。
  - key: duty
    name: 役割・課題
    definition: 人物が担う役割と、その役割に伴う責任や葛藤を表す要素。
    generation_rules:
      - 社会的・物語的・象徴的な観点を散らす。
      - 現代または近未来の職能・身分と空想的な要素を組み合わせる。
  - key: taboo
    name: 禁忌
    definition: 主人公が越えると関係、共同体、自己理解を損なう境界を表す要素。
    generation_rules:
      - 破ったときに関係・共同体・自己理解のどれが損なわれるかを具体化する。
      - 明示された規則だけでなく、本人が内面化した境界や代償も含める。
  - key: place
    name: 場所の性質
    definition: 物語の舞台が人物の行動や関係に与える環境上の性質を表す要素。
    generation_rules:
      - 地形・設備・生活の制約など具体的な性質と、行動や関係を変える抽象的な意味を組み合わせる。
      - 身近な場所から社会の境界や異質な環境まで、規模と視点を散らす。
  - key: era
    name: 時代の性質
    definition: 物語の時間背景にある技術、制度、記憶、変化の速度を表す要素。
    generation_rules:
      - 技術・制度・共有された記憶・変化の速度の観点を散らす。
      - 日常への具体的な影響と、その時代が人物に迫る抽象的な選択を示す。
  - key: object
    name: 象徴的な事物
    definition: 願望、禁忌、記憶、関係の変化を物として具体化する要素。
    generation_rules:
      - 触れられる形状や用途などの具体性に、願望・禁忌・記憶・関係の変化の意味を結びつける。
      - 日用品から共同体の遺物や用途が変化する物まで、距離感を散らす。
  - key: age
    name: 年齢
    definition: 人物の生物学的・社会的な年齢、または時間からずれた年齢を表す要素。
    generation_rules:
      - 生物学的な年齢だけでなく、社会的な役割や時間からのずれも具体化する。
      - 年齢が人物の身体、記憶、権利、他者との関係に与える影響を散らす。
  - key: gender
    name: 性別
    definition: 人物が自認する性別、性別のあり方、または性別が変化する条件を表す要素。
    generation_rules:
      - 自認、周囲からの扱われ方、性別のあり方が変化する条件を区別して扱う。
      - 固定的な類型に寄せず、身体・制度・関係・自己理解の観点を散らす。
  - key: species
    name: 種族
    definition: 人物の生物種、人工的な存在、精霊や怪異としての出自を表す要素。
    generation_rules:
      - 生物種・人工的な存在・精霊や怪異など、出自の観点を散らす。
      - 身体の性質だけでなく、寿命・感覚・社会的な扱いが人物の関係や選択に与える影響を含める。
