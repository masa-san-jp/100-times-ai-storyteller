items:
  - 戦士。人々を守ることに身を捧げる熟練した戦士
  - 魔術師。禁じられた知識を求める秘術の使い手
  - 治療師。命を救うことに尽くす思いやり深い人物
  - 暗殺者。致命的な精度を誇る影の工作員
  - 学者。古代の知恵と失われた伝承を探究する者
  - 商人。あらゆる場所に人脈を持つ抜け目のない商人
  - 貴族。政治的な影響力を持つ高い身分の人物
  - 放浪者。定まった住まいを持たない謎めいた旅人
  - 病む家族の世話を引き受け、生活の順序を守る役目
  - 遠くに暮らす身内へ季節ごとの便りを届ける役目
  - 家族の中で言いにくい決定を皆に伝える役目
