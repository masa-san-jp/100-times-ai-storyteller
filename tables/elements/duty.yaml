  - 誰かが秘密を手放す時に安全な受け皿を用意する役目
  - 隠された契約が誰を縛るか記録する役目
  - 表向きの役割と裏の仕事の境界を保つ役目
  - 重大な判断に秘密が混ざった時に警告する役目
  - 忘れられるべき情報を再発見されないよう封じる役目
  - 危険を招く真実を語る時期を見極める役目
  - 秘密を守る規則そのものを定期的に見直す役目
  - 自分が秘密の一部になったことを認める役目
  - 明かす人と隠す人の責任を同じ記録に残す役目
