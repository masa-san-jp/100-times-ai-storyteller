  - 秘密を知る人数を増やさず判断を支える役目
  - 禁じられた場所の入口を誰にも見つけさせない役目
  - 消された記録が残っている証拠を密かに保管する役目
  - 二つの集まりの間で身元を明かさず情報を運ぶ役目
  - 事実を守るために自分が疑われる立場を引き受ける役目
  - 共有すると争いになる知識を一部だけ伝える役目
  - 嘘をつかずに真相への道筋を閉ざす役目
