items:
  - 過去の記録が現在の判断を強く拘束する時代
  - 新しい仕組みが急速に広がり、古い習慣が揺らぐ時代
  - 遠くの出来事が遅れて届き、待つことが力になる時代
  - 失われた技術を修復しながら暮らす時代
  - 変化の速さが人々の世代間で大きく異なる時代
  - 未来の予測が制度として扱われ、外れることが禁じられた時代
  - 長い停滞の後に、小さな改革が始まった時代
  - 複数の暦が併用され、出来事の順序が揺れる時代
  - 移動と通信の制限が共同体の境界を決める時代
  - 忘却を防ぐ仕組みと、忘れたい記憶が衝突する時代
  - 生活を支える資源の配分が再編される時代
  - 終わりの予告だけが共有され、日々の選択が問われる時代
