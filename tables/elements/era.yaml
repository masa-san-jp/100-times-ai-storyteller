items:
  - text: "古い技術と新しい技術が同じ道具に残る時代"
  - text: "動力の不足を工夫で補う技術が広がる時代"
  - text: "生産より修理の知識が重く評価される時代"
  - text: "遠隔の合図を受け取るまで長く待つ時代"
  - text: "手作業と自動化の境目が仕事ごとに違う時代"
  - text: "失われた材料を代替品で組み立て直す時代"
  - text: "目に見えない変化を測る道具が生活に浸透した時代"
  - text: "誰でも使える技術と専門技術が分かれる時代"
  - text: "ひとつの発明が暮らしの順序を変え続ける時代"
  - text: "道具の仕組みを知ることが権力になる時代"
  - text: "技術の安全性を試す時間が足りない時代"
  - text: "古い通信と新しい通信が同じ情報を運ぶ時代"
  - text: "自然の動きを利用する装置が主流になった時代"
  - text: "使い捨てより長く直せる物が信頼される時代"
  - text: "技術の使い方を巡って世代間の見解が割れる時代"
  - text: "壊れた機械の部品から新しい用途を探す時代"
  - text: "記憶を補助する道具が日常の判断に入る時代"
  - text: "使える技術を誰が決めるかが問われる時代"
  - text: "小さな発見が広まる速度を制度が制御する時代"
  - text: "動力の流れが季節の変化に左右される時代"
  - text: "役職より任期の長さが信頼を決める制度の時代"
  - text: "合議の記録が決定そのものとみなされる時代"
  - text: "住む場所で受けられる権利が変わる制度の時代"
  - text: "規則の例外を誰が認めるかが争点になる時代"
  - text: "共同体ごとに異なる暦が公的に併存する時代"
  - text: "裁く人と記録する人が分けられている制度の時代"
  - text: "代表を選ぶ方法が季節ごとに見直される時代"
  - text: "境界を越える許可が身分ではなく行為で決まる時代"
  - text: "学ぶ期間の長さが働き方を左右する時代"
  - text: "罰より回復を優先する仕組みが試される時代"
  - text: "公共の資源を配る順序が制度の中心になる時代"
  - text: "規則を覚えるより問い直すことが評価される時代"
  - text: "届出のない暮らしも一定の権利を持つ時代"
  - text: "誰の記録を公文書にするかが争われる時代"
  - text: "仕事の資格を共同体ごとに認め合う制度の時代"
  - text: "小さな集まりの決定が大きな制度を変える時代"
  - text: "統治の正当性を毎世代説明し直す時代"
  - text: "違反の理由を聞いてから処遇を決める時代"
  - text: "公共の判断を後から検証できる制度の時代"
  - text: "制度の空白を人々の合意で一時的に埋める時代"
  - text: "大きな災いの記憶が日常の規則を形づくる時代"
  - text: "語り継がれた歴史と保存された記録が食い違う時代"
  - text: "忘れることを社会の技術として学ぶ時代"
  - text: "先祖の判断が現在の責任として残る時代"
  - text: "過去の出来事を複数の暦で記念する時代"
  - text: "失われた記録を空白のまま守ることが尊ばれる時代"
  - text: "記憶の持ち主が変わるたび歴史の意味が揺れる時代"
  - text: "昔の言葉を読める者だけが決定を左右する時代"
  - text: "以前の失敗を再現して安全を確かめる時代"
  - text: "人々の体験を公的な記録へ移す方法が争われる時代"
  - text: "死者の名をどこまで残すかが問われる時代"
  - text: "過去を語る順番が社会の立場を反映する時代"
  - text: "共有された記憶が個人の証言を上書きする時代"
  - text: "記録の改変が時間を越えて発見される時代"
  - text: "忘れられた出来事が新しい制度の根拠になる時代"
  - text: "同じ歴史を異なる場所で別々に教える時代"
  - text: "失われた言葉を日常へ戻そうとする時代"
  - text: "記憶の断片をつなぐ作業が職業になる時代"
  - text: "過去を確定せず問いのまま残す博物館の時代"
  - text: "以前の約束が今の暮らし方を拘束する時代"
  - text: "水の配分が働く時間と移動を決める時代"
  - text: "食べ物の保存技術が共同体の寿命を左右する時代"
  - text: "使える土地の減少が居住地を頻繁に動かす時代"
  - text: "稀少な材料の代わりに時間が取引される時代"
  - text: "余った物を捨てず用途ごとに循環させる時代"
  - text: "資源の採取量より回復速度が重視される時代"
  - text: "遠い地域の不足が日常の価格を直接揺らす時代"
  - text: "共有の備蓄を誰が開くかが政治になる時代"
  - text: "動力源の違いで地域の生活時間が分かれる時代"
  - text: "生産者と利用者の距離が極端に近い時代"
  - text: "資源の不足を配給ではなく交換で調整する時代"
  - text: "土地の使用履歴が新しい利用権を決める時代"
  - text: "必要な物を作る技術が物そのものより尊ばれる時代"
  - text: "自然の回復を待つことが最重要の投資になる時代"
  - text: "資源を運ぶ経路の安全が暮らしを支える時代"
  - text: "道具を所有せず必要な時だけ借りる時代"
  - text: "同じ材料の価値が季節によって変動する時代"
  - text: "廃棄物の行き先が地域の境界を決める時代"
  - text: "資源を使う量が社会的な責任として記録される時代"
  - text: "生活の豊かさを所有量以外で測ろうとする時代"
  - text: "一日の長さを場所ごとの明るさで測る時代"
  - text: "待つことの長さが人間関係を選別する時代"
  - text: "過去と未来の出来事が同じ日に語られる時代"
  - text: "変化の速さを世代ごとに別の尺度で感じる時代"
  - text: "決められた時刻より合図の到着を基準にする時代"
  - text: "予定より偶然の訪れを重く見る時代"
  - text: "季節の境目が記録ではなく身体でわかる時代"
  - text: "長い停滞の中で小さな変化を祝う時代"
  - text: "終わりの時期を予告されながら暮らす時代"
  - text: "同じ出来事を何度も始まりとして迎える時代"
  - text: "未来の予測が現在の行動を拘束する時代"
  - text: "忘却の速度が記録の保存期間を決める時代"
  - text: "世代を越える計画を一人の人生で測れない時代"
  - text: "後から起きた出来事が前の原因を書き換える時代"
  - text: "時間の不足より選ぶ順番が問題になる時代"
  - text: "過去へ戻れなくてもやり直しを制度化する時代"
  - text: "変化しないものを探すことが最も危険な時代"
  - text: "未来のために現在の満足を先送りする時代"
  - text: "期限を定めない約束が時間の感覚を変える時代"
  - text: "終わったことを終わりと呼ぶ基準が揺らぐ時代"
