items:
  - text: "リズミカルな動きで因果関係を逆転できる"
    source: "Can reverse causality through rhythmic movement"
  - text: "感情を色として吸収し、入れ墨を動かせる"
    source: "Can absorb emotions as colors and animate tattoos"
  - text: "どの部屋でも最後に発せられた言葉を聞ける"
    source: "Can hear the last words spoken in any room"
  - text: "折り紙のように空間を折りたためるが、直線に沿う場合だけできる"
    source: "Can fold space like origami, but only along straight lines"
  - text: "他人の技能をちょうど一分間借りられる"
    source: "Can borrow another person's skill for exactly one minute"
  - text: "書かれた言葉を生きた昆虫に変えられる"
    source: "Can turn written words into living insects"
  - text: "あらゆる決断の代償を浮かぶ数字として見られる"
    source: "Can see the price of every decision as a floating number"
  - text: "息を止めている間、世界を停止できる"
    source: "Can pause the world while holding their breath"
  - text: "誰でも今聞いた一文を忘れさせられる"
    source: "Can make anyone forget one sentence they just heard"
  - text: "口にした約束から植物を育てられる"
    source: "Can grow plants from spoken promises"
  - text: "機械や家電の言語を翻訳できる"
    source: "Can translate the language of machines and appliances"
  - text: "髪に日光を蓄え、夜に放出できる"
    source: "Can store sunlight in their hair and release it at night"
  - text: "触れた二つの物体の重さを入れ替えられる"
    source: "Can swap the weight of two objects they touch"
  - text: "写真の中へ入り、小さな細部を変えられる"
    source: "Can walk into photographs and change small details"
  - text: "嘘を苦味として味わえる"
    source: "Can taste lies as bitterness"
  - text: "泣くことによってだけ、雨を呼べる"
    source: "Can summon rain by crying, and only by crying"
  - text: "一つの物体を最大一時間前まで巻き戻せる"
    source: "Can rewind a single object by up to one hour"
  - text: "影を立てるほど固体にできる"
    source: "Can make shadows solid enough to stand on"
  - text: "再会する人々を結ぶ糸を見られる"
    source: "Can see the thread connecting people who will meet again"
  - text: "誰とでも夢を通じて話せるが、目覚めると忘れてしまう"
    source: "Can speak with anyone through their dreams, but forgets it upon waking"
  - text: "音を光に、光を音に変えられる"
    source: "Can turn sound into light and light into sound"
  - text: "どんな扉でも、以前訪れた場所へ通じさせられる"
    source: "Can make any door open onto a place they have been before"
  - text: "瞬間をガラス玉に凍結し、後で再生できる"
    source: "Can freeze a moment into a glass marble and replay it later"
  - text: "物に触れてその履歴を読める"
    source: "Can read the history of an object by holding it"
  - text: "手の届く範囲内なら重力の向きをどの方向にも変えられる"
    source: "Can make gravity point in any direction within arm's reach"
  - text: "人の顔を写せるが、声は写せない"
    source: "Can copy a person's face but not their voice"
  - text: "歌い続ける限り電気を操れる"
    source: "Can command electricity as long as they keep singing"
  - text: "次の十秒を予測できるが、他人についてだけである"
    source: "Can predict the next ten seconds, but only for others"
  - text: "傷を自分の体に引き受けることで治せる"
    source: "Can heal wounds by taking them onto their own body"
  - text: "硬貨ほどの大きさまで縮められる"
    source: "Can shrink to the size of a coin"
  - text: "ラジオの雑音を通じて死者と話せる"
    source: "Can talk to the dead through static on a radio"
  - text: "物に冗談を言って軽くできる"
    source: "Can make objects lighter by telling them jokes"
  - text: "壁越しに水越しのように見通せる"
    source: "Can see through walls as if they were water"
  - text: "植物だけ時間を速く進められる"
    source: "Can make time move faster for plants only"
  - text: "自分自身を三つの小さな分身に分けられる"
    source: "Can split into three smaller copies of themselves"
  - text: "怒りを熱に、悲しみを冷気に変えられる"
    source: "Can turn anger into heat and sadness into cold"
  - text: "カメラや画面から自分の存在を消せる"
    source: "Can erase their presence from cameras and screens"
  - text: "一キロメートル以内でつかれた嘘を感知できる"
    source: "Can sense lies told within one kilometer"
  - text: "何でも描いて日の出まで生命を与えられる"
    source: "Can draw anything and bring it to life until sunrise"
  - text: "どんな気体でも吸い、花として吐き出せる"
    source: "Can breathe any gas and exhale it as flowers"
  - text: "お茶を差し出して人に真実を話させられる"
    source: "Can make people tell the truth by offering them tea"
  - text: "指先で磁力を操れる"
    source: "Can manipulate magnetism through their fingertips"
  - text: "鏡の中だけに通じる門を開けられる"
    source: "Can open portals, but only inside mirrors"
  - text: "物体を数秒で数世紀分だけ老化させられる"
    source: "Can age objects forward by centuries in seconds"
  - text: "動物の思考を詩として聞ける"
    source: "Can hear the thoughts of animals as poetry"
  - text: "約束を物理的に破れなくできる"
    source: "Can make a promise physically unbreakable"
  - text: "貝殻の中に記憶を保存できる"
    source: "Can store memories inside seashells"
  - text: "子供にだけ見える幻影を作れる"
    source: "Can create illusions only children can see"
  - text: "水たまりに足を踏み入れて瞬間移動できる"
    source: "Can teleport by stepping into puddles"
  - text: "体を砂に変えて再形成できる"
    source: "Can turn their body into sand and reform it"
  - text: "都市の噂の流れを操れる"
    source: "Can control the flow of rumors in a city"
  - text: "鼻歌で誰でも眠らせられる"
    source: "Can make anyone fall asleep by humming"
  - text: "光線の上を歩ける"
    source: "Can walk on light beams"
  - text: "祖母の眼鏡をかけた時だけ幽霊が見える"
    source: "Can see ghosts only when wearing their grandmother's glasses"
  - text: "眠らなかった一時間ごとに一キログラムを念力で動かせる"
    source: "Can move one kilogram with their mind for every hour they did not sleep"
  - text: "水を記憶する形に曲げられる"
    source: "Can bend water into shapes that remember"
  - text: "どんな食べ物でも忘れていた記憶の味にできる"
    source: "Can make any food taste like a forgotten memory"
  - text: "物から色を盗み、エネルギーとして使える"
    source: "Can steal the color out of objects and use it as energy"
  - text: "自分が最後に発した言葉を取り消せる"
    source: "Can undo the last word they spoke"
  - text: "壊れた機械を修理する音楽を作れる"
    source: "Can make music that repairs broken machines"
  - text: "まばたきのモールス信号で星と通信できる"
    source: "Can communicate with stars through Morse code blinks"
  - text: "自分の周囲の時計を止められる"
    source: "Can make clocks stop in their vicinity"
  - text: "踊っている間だけ雷を呼べる"
    source: "Can call lightning, but only while dancing"
  - text: "どんな本の中にも隠れ、内部から読める"
    source: "Can hide inside any book and read from within"
  - text: "その場所の過去の感情を誰にでも感じさせられる"
    source: "Can make anyone feel the emotions of a place's past"
  - text: "小さな庭だけ季節を変えられる"
    source: "Can change the season in a small garden"
  - text: "嘘をつくと砕ける水晶の鎧を育てられる"
    source: "Can grow crystal armor that shatters when they lie"
  - text: "世界が壊れるかもしれない亀裂を見られる"
    source: "Can see the cracks where the world might break"
  - text: "テレビ画面から物体を引き出せる"
    source: "Can pull objects out of television screens"
  - text: "こだまに質問の答えを返させられる"
    source: "Can make echoes answer questions"
  - text: "無生物に一日だけ生命を与えられる"
    source: "Can give inanimate objects one day of life"
  - text: "人の最大の後悔を、その背後の影として見られる"
    source: "Can see a person's greatest regret as a shadow behind them"
  - text: "紙飛行機を大陸の彼方まで飛ばせる"
    source: "Can make paper airplanes fly across continents"
  - text: "声を物理的な壁に変えられる"
    source: "Can turn their voice into a physical wall"
  - text: "傷跡の代わりに傷を花咲かせられる"
    source: "Can make wounds bloom into flowers instead of scars"
  - text: "二つの記憶を一つに融合できる"
    source: "Can fuse two memories into one"
  - text: "自分の持ち物以外なら、失われたものを何でも見つけられる"
    source: "Can locate anything that was lost, except their own things"
  - text: "すべての言語を話せるが、未来時制だけで話す"
    source: "Can speak every language, but only in the future tense"
  - text: "心拍を遅くして捕食者から見えなくなれる"
    source: "Can slow their heartbeat to become invisible to predators"
  - text: "自信に応じて体の大きさを変えられる"
    source: "Can change their size according to their confidence"
  - text: "嘘を浮かんで消える泡に変えられる"
    source: "Can turn lies into bubbles that float away"
  - text: "鳥を呼び、手紙や小物を運ばせられる"
    source: "Can call birds to carry messages and small objects"
  - text: "機械の寿命を見られる"
    source: "Can see the lifespan of machines"
  - text: "生き物を焼かない火を作れる"
    source: "Can make fire that does not burn living things"
  - text: "一日一度、時間の外側に部屋を作れる"
    source: "Can create a room outside of time once per day"
  - text: "他人と感覚を交換できる"
    source: "Can exchange senses with another person"
  - text: "どんな表面でも自宅への出入口にできる"
    source: "Can make any surface into a doorway to their home"
  - text: "俳句を書くことで嵐を鎮められる"
    source: "Can calm storms by writing haiku"
  - text: "人の未来の姿を一秒間だけ見られる"
    source: "Can see a person's future self for one second"
  - text: "硬貨を増やせるが、複製一枚ごとに記憶を一つ奪う"
    source: "Can make coins multiply, but each copy steals a memory"
  - text: "空気をガラスに硬化できる"
    source: "Can harden air into glass"
  - text: "傷に、どうしてできたかの物語を語らせられる"
    source: "Can make wounds tell the story of how they happened"
  - text: "水に映る月から力を引き出せる"
    source: "Can draw power from the moon's reflection in water"
  - text: "誰の足音も無音にできる"
    source: "Can make anyone's footsteps silent"
  - text: "涙を小さな願いをかなえる真珠に変えられる"
    source: "Can turn their tears into pearls that grant small wishes"
  - text: "笑う人すべての重力を逆転できる"
    source: "Can reverse gravity for everyone who laughs"
  - text: "人々の間にある目に見えない負債の糸を見られる"
    source: "Can see the invisible threads of debt between people"
  - text: "最後に触れた動物へ変身できる"
    source: "Can transform into the last animal they touched"
  - text: "月光から守護のお守りを編める"
    source: "Can knit protective charms from moonlight"
  - text: "記憶を食べられる菓子に変えられる"
    source: "Can turn memories into edible sweets"
