items:
  - 意のままに火を操れる
  - 人の心を読める
  - 超人的な力を持っている
  - 姿を消せる
  - 他者を癒やす力がある
  - 短い時間なら時を操れる
  - 完全な記憶力を持っている
  - 動物と意思疎通できる
  - 重い荷物を身体の軸で安定させられる
  - 狭い足場でも姿勢を崩さず進める
  - 長時間の疲労を小さな動きに分散できる
  - 傷の位置から受けた力の向きを読める
  - 道具なしで水の流れをせき止められる
  - 指先の感覚だけで細かな結び目をほどける
  - 暗い場所でも足音を乱さず移動できる
  - 自分の体温を意識して変えられる
  - 風の抵抗を受け流して速く走れる
  - 触れた相手の動きを先回りして受け止められる
  - 高低差のある場所を安全な経路に変えられる
  - 片手で扱える重さの限界を見極められる
  - 呼吸の間隔を変えて長く潜れる
  - 体の重心を移しながら狭い場所を抜けられる
  - 無理な姿勢からでも素早く立て直せる
  - 手近な素材を即席の防具に組み替えられる
  - 複数の作業を左右の手で分担できる
  - 気温に合わせて動きの強さを調節できる
  - 音を立てずに物を運ぶ歩き方を選べる
  - 失った道具の代わりに身体の工夫を使える
  - 物音の反射から部屋の広さを測れる
  - 匂いの変化から近くの出来事を推測できる
  - 微かな揺れから遠くの動きを察知できる
  - 相手の沈黙に含まれる迷いを感じ取れる
  - 光の角度だけで時刻のずれを見抜ける
  - 見慣れた物の配置の違いを見つけられる
  - 複数の声から一つの言葉だけを聞き分けられる
  - 触れた表面の履歴を手触りから想像できる
  - 記憶にない景色の変化を正確に描ける
  - 他人の視線が集まる場所を避けて動ける
  - 夢と現実の境目が揺れた瞬間を捉えられる
  - 誰も注目しない兆候を関連づけて見つけられる
  - 水面の乱れから隠れた形を推測できる
  - 相手の呼吸の変化から返答の準備を読める
  - 文字の欠落から書き手のためらいを見抜ける
  - 音のない変化を周囲の反応で察知できる
  - 目印のない場所でも方向の偏りを感じられる
  - 遠い場所の気配を自分の記憶と照合できる
  - 同じ現象の違う見え方を区別して記録できる
  - 複雑な手順を短い規則にまとめられる
  - 初めて見る仕組みを分解せず働きから理解できる
  - 欠けた記録から起きた順序を組み立てられる
  - 互いに矛盾する証言の共通部分を探せる
  - 限られた資源の使い道を先に比較できる
  - 古い道具の用途を痕跡から推定できる
  - 未来の結果を複数の仮説で試算できる
  - 人の流れを数値にせず構造として把握できる
  - 複雑な話を相手の理解に合わせて言い換えられる
  - 失敗した手順から再発の条件を抜き出せる
  - 知らない規則でも例外から全体を推測できる
  - 異なる分野の知識を一つの問いへ結びつけられる
  - 観察と推測を混同せずに記録できる
  - 大きな変化を小さな兆候へ分けて説明できる
  - 他者から受けた知恵の出所を忘れずに示せる
  - 読めない文字列を配置と反復から解読できる
  - 争点を感情と事実に分けて整理できる
  - 少ない材料から安全な実験の順序を設計できる
  - 定説が外れる条件を先に列挙できる
  - 蓄積した知識を必要な時だけ取り出せる
  - 初対面の相手が話しやすい沈黙をつくれる
  - 異なる立場の要求を一つの合意へ翻訳できる
  - 相手の拒否を保ったまま交渉を続けられる
  - 誰にも属さない場所で協力者を見つけられる
  - 隠された負担を会話の流れから察知できる
  - 対立する二人が互いの理由を聞く場を整えられる
  - 約束の抜け道を使わずに条件を調整できる
  - 人の得意を見つけて役割を組み替えられる
  - 相手の言葉を奪わず要点だけを返せる
  - 共有した記憶を争いの仲立ちに使える
  - 誰かの失敗を責めずに手順へ変えられる
  - 秘密を守りながら必要な助けを呼べる
  - 集団の沈黙が示す不安を一人ずつ確かめられる
  - 与える側と受ける側を固定しない関係を築ける
  - 追放された人にも選択肢を残して話せる
  - 知らない習慣を尊重しながら問い直せる
  - 役割を終えた相手とのつながりをほどよく保てる
  - 一度見た配置を頭の中で何度も組み直せる
  - 触れたものの過去を断片的な像として感じられる
  - 他者の夢に言葉ではなく景色を送れる
  - 失われた音を周囲の物の振動から再現できる
  - 時間の流れのずれを短い範囲だけ共有できる
  - 物の持ち主ではなく関係の変化を映し出せる
  - 見えない境界に触れた場所だけ温度を変えられる
  - 忘れられた名前を呼ばずに存在だけ呼び戻せる
  - 同じ出来事を複数の視点の記憶として保てる
  - 近くにない道具の使い方を手元で再現できる
  - 生き物の境界を越えずに意図だけ伝えられる
  - まだ起きていない選択の枝を短時間だけ見られる
  - 触れた約束の破れを形の変化として示せる
  - 自分の影を別の場所の目印として残せる
  - 変化の途中にある物を一瞬だけ固定できる
  - 誰も教えられない問いを相手の中に芽生えさせられる
