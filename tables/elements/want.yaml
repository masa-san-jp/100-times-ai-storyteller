items:
  - text: "十歳の誕生日に自分の影を盗んだ人を見つけたい"
    source: "I want to find the person who stole my shadow on my tenth birthday."
  - text: "死者も生者も訪れられるラーメン店を開きたい"
    source: "I want to open a ramen shop that the dead and the living can both visit."
  - text: "母が自分を記憶から消した理由を知りたい"
    source: "I want to learn why my mother erased me from her memories."
  - text: "街の全員が争わず共有できる記憶を設計したい"
    source: "I want to design a memory that everyone in the city can share without fighting."
  - text: "四十年前に見知らぬ人から受けた親切を返したい"
    source: "I want to repay a kindness I received from a stranger forty years ago."
  - text: "丸一日だけ普通の人になりたい"
    source: "I want to become ordinary for just one full day."
  - text: "絶滅した空飛ぶ鯨がまだ生きていると証明したい"
    source: "I want to prove that the extinct sky whales are still alive."
  - text: "亡き伴侶が書き始めた小説を完成させたい"
    source: "I want to finish the novel my late partner started."
  - text: "誤って水没させた町に許してもらいたい"
    source: "I want to be forgiven by the town I accidentally flooded."
  - text: "自分の力が誰も傷つけない場所を見つけたい"
    source: "I want to find a place where my power does not hurt anyone."
  - text: "初めて自分自身の声を聞きたい"
    source: "I want to hear my own voice for the first time."
  - text: "名前を売った悪魔から自分の名を買い戻したい"
    source: "I want to win back my name from the demon I sold it to."
  - text: "人間になりたい怪物のための学校を建てたい"
    source: "I want to build a school for monsters who want to become human."
  - text: "体が完全に石になる前に海を見たい"
    source: "I want to see the ocean before my body turns completely to stone."
  - text: "一度も目覚めなかった夢から弟を救い出したい"
    source: "I want to rescue my little brother from the dream he never woke up from."
  - text: "疲れ果てた村の神に代わり、自分が神になりたい"
    source: "I want to replace the god of my village, who has grown tired."
  - text: "三百年間届けられなかった手紙を届けたい"
    source: "I want to deliver a letter that has been undeliverable for three hundred years."
  - text: "消えた後も少なくとも一人に覚えていてもらいたい"
    source: "I want to be remembered by at least one person after I disappear."
  - text: "自分の分身のうち誰が本物か突き止めたい"
    source: "I want to find out which of my clones is the original."
  - text: "疎遠な父が死ぬ前に一度笑わせたい"
    source: "I want to make my estranged father laugh once before he dies."
  - text: "先祖がカードゲームで失った島を買い戻したい"
    source: "I want to buy back the island my ancestors lost in a card game."
  - text: "毎年一つの願いを犠牲にする祭りを止めたい"
    source: "I want to stop the festival that sacrifices one wish every year."
  - text: "葬式を許された最初のロボットになりたい"
    source: "I want to become the first robot to be granted a funeral."
  - text: "故郷を灰色にした悲しさを治したい"
    source: "I want to cure the sadness that turned my hometown gray."
  - text: "祖母が口ずさんだ、すべての戦争を終わらせる歌を見つけたい"
    source: "I want to find the song that ends all wars, which my grandmother hummed."
  - text: "自分が書き込まれた物語から逃げたい"
    source: "I want to escape the story I was written into."
  - text: "亡くなった犬のため月に森を植えたい"
    source: "I want to plant a forest on the moon for my late dog."
  - text: "転生する前の自分が何だったのか知りたい"
    source: "I want to know what I was before I was reincarnated."
  - text: "誤って空から落とした星を元に戻したい"
    source: "I want to return the stars I accidentally knocked out of the sky."
  - text: "街の街灯にもう一度歌わせたい"
    source: "I want to make the city's streetlights sing again."
  - text: "妹の経営不振の店を救えるだけの幸運を稼ぎたい"
    source: "I want to earn enough luck to save my sister's failing restaurant."
  - text: "本当の顔を映す唯一の鏡を見つけたい"
    source: "I want to find the one mirror that shows my real face."
  - text: "壊れずに負ける方法をライバルに教えたい"
    source: "I want to teach my rival how to lose without breaking."
  - text: "弟子が自分を超えるまで生きたい"
    source: "I want to live long enough to see my apprentice surpass me."
  - text: "山に自分を縛る約束を破りたい"
    source: "I want to break the promise that binds me to the mountain."
  - text: "怪物も英雄になれると生放送で証明したい"
    source: "I want to prove that monsters can be heroes on live television."
  - text: "父が自分に不利になるよう仕組んだ料理大会で勝ちたい"
    source: "I want to win the cooking contest that my father rigged against me."
  - text: "自分の民が忘れた空の色を取り戻したい"
    source: "I want to recover the color of the sky that my people forgot."
  - text: "力を使わずに愛されたい"
    source: "I want to be loved without using my powers."
  - text: "村の時間を操る時計の修理を終えたい"
    source: "I want to finish repairing the clock that controls my village's time."
  - text: "世界が終わった時に解散したバンドを再結成したい"
    source: "I want to reunite the band that broke up when the world ended."
  - text: "未来の自分の墓に花を置く人が誰か知りたい"
    source: "I want to discover who has been leaving flowers at my future grave."
  - text: "毎週日曜日を忘れてしまう呪いの治療法を見つけたい"
    source: "I want to find a cure for the curse that makes me forget every Sunday."
  - text: "本物の英雄になり、スタントの替え玉をやめたい"
    source: "I want to become a real hero instead of a stunt double."
  - text: "湖底から故郷を連れ戻したい"
    source: "I want to bring my hometown back from the bottom of the lake."
  - text: "亡き恩師の声をもう一度聞きたい"
    source: "I want to hear my late teacher's voice one more time."
  - text: "生まれた図書館を出る権利を得たい"
    source: "I want to earn the right to leave the library I was born in."
  - text: "予言が記した悪役ではないと証明したい"
    source: "I want to prove I am not the villain the prophecy described."
  - text: "自分の部屋に取り憑く幽霊と結婚したい"
    source: "I want to marry the ghost who haunts my apartment."
  - text: "争い続ける二つの村の橋を再建したい"
    source: "I want to rebuild the bridge between the two feuding villages."
  - text: "引退して静かにトマトを育てたい"
    source: "I want to retire and grow tomatoes in peace."
  - text: "三十歳になったら食べると約束した竜を見つけたい"
    source: "I want to find the dragon that promised to eat me when I turned thirty."
  - text: "地下都市の市長になりたい"
    source: "I want to become the mayor of the underground city."
  - text: "星が自分にメッセージを送り続ける理由を理解したい"
    source: "I want to understand why the stars keep sending me messages."
  - text: "裏切った人工知能との友情を修復したい"
    source: "I want to repair my friendship with the AI I betrayed."
  - text: "世界一醜い怪物に美しいと感じてもらいたい"
    source: "I want to make the ugliest monster in the world feel beautiful."
  - text: "嵐の中で消えた灯台守を救い出したい"
    source: "I want to rescue the lighthouse keeper who vanished during the storm."
  - text: "不死を普通の一生と交換したい"
    source: "I want to trade my immortality for one ordinary lifetime."
  - text: "最初の記憶の味がするレシピを見つけたい"
    source: "I want to find the recipe that tastes like my first memory."
  - text: "世界中の失くされた傘をすべて集めたい"
    source: "I want to collect every lost umbrella in the world."
  - text: "お気に入りの悲劇の結末を書き換えたい"
    source: "I want to rewrite the ending of my favorite tragedy."
  - text: "子供の頃に必要だったような大人になりたい"
    source: "I want to become the kind of adult I needed as a child."
  - text: "海の民と漁師の間に平和を築きたい"
    source: "I want to make peace between the sea people and the fishermen."
  - text: "家族を完璧な複製に置き換えた者を見つけたい"
    source: "I want to find out who replaced my family with perfect copies."
  - text: "自分を追放した国から勲章をもらう資格を得たい"
    source: "I want to earn a medal from the country that exiled me."
  - text: "自分はすでに死んでいるという噂を止めたい"
    source: "I want to stop the rumor that I am already dead."
  - text: "戦争の夢を見ずに眠れるようになりたい"
    source: "I want to learn to sleep without dreaming of the war."
  - text: "博物館から盗まれた自分の心臓を取り戻したい"
    source: "I want to get my stolen heart back from the museum."
  - text: "笑い方を忘れた世界でコメディアンになりたい"
    source: "I want to become a comedian in a world that forgot how to laugh."
  - text: "森の精霊に市議会での投票権を与えたい"
    source: "I want to give the forest spirits a vote in the city council."
  - text: "最後の竜の卵の新しい家を見つけたい"
    source: "I want to find a new home for the last dragon egg."
  - text: "一千年続く家族の裏切りの習慣を断ちたい"
    source: "I want to break my family's thousand-year-old habit of betrayal."
  - text: "不正で自分の王座を奪った王者を倒したい"
    source: "I want to beat the champion who stole my title with cheating."
  - text: "自分を育てたロボットを再建したい"
    source: "I want to rebuild the robot that raised me."
  - text: "星へ戻る前に雪を味わいたい"
    source: "I want to taste snow before I go back to the stars."
  - text: "誰も届け出ない犯罪を扱う探偵事務所を開きたい"
    source: "I want to open a detective agency for crimes nobody reports."
  - text: "背中に入れ墨された地図のもう半分を見つけたい"
    source: "I want to find the other half of the map tattooed on my back."
  - text: "取り壊しから町で最後の映画館を守りたい"
    source: "I want to protect my town's last cinema from demolition."
  - text: "自分の思考を聞ける人を見つけたい"
    source: "I want to find the person who can hear my thoughts."
  - text: "母のようにならずに母を誇らせたい"
    source: "I want to make my mother proud without becoming like her."
  - text: "毎週火曜日に再開する時間ループから逃げたい"
    source: "I want to escape from the time loop that restarts every Tuesday."
  - text: "世界中が自分を覚えている一つの過ちを消したい"
    source: "I want to erase the one mistake the whole world remembers me for."
  - text: "眠れる巨人を目覚めさせる旋律を見つけたい"
    source: "I want to find the melody that wakes the sleeping giant."
  - text: "自動販売機に閉じ込められた精霊の自由を買いたい"
    source: "I want to buy freedom for the spirits trapped in the vending machines."
  - text: "泣き方を学びたい"
    source: "I want to learn how to cry."
  - text: "祖母の最後のレシピを、祖母の初恋の相手へ届けたい"
    source: "I want to deliver my grandmother's last recipe to her first love."
  - text: "有名な父より優れた悪役になりたい"
    source: "I want to become a better villain than my famous father."
  - text: "消える前に逆向きの老化を止めたい"
    source: "I want to stop aging backwards before I disappear."
  - text: "自分の発明で飢えを終わらせられると証明したい"
    source: "I want to prove that my invention can end hunger."
  - text: "人生から抜け落ちた時間がどこへ行ったか見つけたい"
    source: "I want to find where the missing hours of my life went."
  - text: "月に自分の存在を気づかせたい"
    source: "I want to make the moon notice me."
  - text: "自分の力を恐れない友達を見つけたい"
    source: "I want to find a friend who is not afraid of my power."
  - text: "町が忘れた祭りを復活させたい"
    source: "I want to bring back the festival my town forgot."
  - text: "誰も殺さずに戦争に勝ちたい"
    source: "I want to win the war without killing anyone."
  - text: "次の桜の季節までに人間になりたい"
    source: "I want to become human before the next cherry blossom season."
  - text: "妹の手術代のために売った記憶を取り戻したい"
    source: "I want to recover the memories I sold to pay for my sister's surgery."
  - text: "創造主に最後に会い、なぜかと尋ねたい"
    source: "I want to see my creator one last time and ask why."
  - text: "もうどこか思い出せないが、家へ帰りたい"
    source: "I want to go home, although I no longer remember where it is."
  - text: "先祖が途中で捨てた巡礼を終えたい"
    source: "I want to finish the pilgrimage my ancestors abandoned."
  - text: "世界に恐れず幽霊を見られるよう教えたい"
    source: "I want to teach the world to see ghosts without fear."
