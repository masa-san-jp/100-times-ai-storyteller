items:
  - 他者の弱さを許可なく交渉材料にする
  - 助けを求める声を立場の低さとして扱う
  - 相手の選択を善意の名で先回りして奪う
  - 聞いた秘密を親密さの証として広める
  - 間違いを認めた人だけに責任を集中させる
  - 異なる習慣を未熟さの証拠として笑う
  - 返せない恩を相手の一生へ請求する
  - 相手の沈黙を同意として都合よく使う
  - 救うふりをして相手の判断を奪い続ける
  - 失敗した人を共同体から見えなくする
  - 権力のある者の嘘だけを必要な現実と呼ぶ
  - 誰かの喪失を自分の正しさの証明にする
  - 立場の違う者を同じ尺度だけで裁く
  - 不在の人について本人抜きで結論を固める
  - 受けた親切を弱みとして相手に返す
  - 相手の過去を現在の罪として扱う
  - 反対意見を聞く前に裏切りと決めつける
  - 弱い立場の人だけに沈黙を求める
  - 誰かの居場所を守るため別の誰かを追い出す
  - 赦しを迫って傷ついた側の時間を奪う
  - 恐怖を感じないふりで危険を見過ごす
  - 疲れを隠して助けを受ける機会を捨てる
  - 自分の価値を役に立つ量だけで測り続ける
  - 間違いを認めないため記録の方を壊す
  - 悲しみを急いで意味ある教訓に変える
  - 自分の望みを他者の期待として語り直す
  - 痛みを耐えた量で人の優劣を決める
  - 逃げたい気持ちを臆病さとして封じ込める
  - 休むことを失敗の証拠として罰し続ける
  - 自分だけが真相に近いと思い込み孤立する
  - 変わる可能性を過去の自分に禁じる
  - 欲しいものを望むこと自体を恥じて隠す
  - 自分の限界を他者に知られないよう無理をする
  - 誰にも頼らないことを自由と取り違える
  - 失った人の代わりになる役を自分に課す
  - 自分の記憶だけを事実の基準にする
  - 赦せない自分を正義そのものだと信じる
  - 心の揺れをなくすため感覚を鈍らせる
  - 自分の選択を運命のせいにして見直さない
  - 望まない役割を演じるほど安全だと決める
  - 消された出来事をなかったこととして保存する
  - 都合のよい記憶だけを皆の歴史にする
  - 語り手の都合で死者の言葉を書き換える
  - 思い出せないことを裏切りの証拠にする
  - 記憶の違いを一方の嘘として封じる
  - 忘れられた人の名前を記録から外し続ける
  - 過去の痛みを美しい物語にして消費する
  - 古い証言を今の価値観だけで切り捨てる
  - 思い出す時期を本人ではなく集団が決める
  - 記憶を保存する代わりに所有権を奪う
  - 失われた記録の空白を想像で埋めて断定する
  - 誰かの記憶を正しさの競争に持ち込む
  - 忘却を選んだ人へ思い出す義務を負わせる
  - 過去を語る人の現在を見ないことにする
  - 変わった自分に昔の約束だけを守らせる
  - 受け継いだ記憶を検証せず教訓と呼ぶ
  - 傷ついた人の語りを証拠がないと退ける
  - 記録の順番を変えて因果関係を偽る
  - もう語れない人の沈黙を承認として残す
  - 忘れたい記憶を他者の許可なく掘り返す
  - 守れない約束を安心させるために結ぶ
  - 条件を隠したまま同意だけを取りつける
  - 約束を果たした人へ新しい義務を重ねる
  - 事情が変わっても最初の言葉を絶対視する
  - 二人の約束を集団の命令として利用する
  - 約束を守るため誰かの拒否を無視する
  - 返事のない相手に承諾したことを負わせる
  - 誓いを立てた人だけに損失を引き受けさせる
  - 破った理由を聞かず人格の問題にする
  - 秘密の約束を知らない人の判断へ影響させる
  - 期限のない忠誠を当然の責任として求める
  - 互いに違う意味で同じ言葉を使い続ける
  - 約束の証を持つ人へ決定権まで与える
  - 約束を断る自由を恩知らずとして罰する
  - 一度の約束で未来の選択肢をすべて閉じる
  - 交わした言葉より周囲の評判を優先する
  - 約束を守れない自分を隠すため他者を責める
  - 叶わない願いを誓いで現実に見せかける
  - 約束の内容を後から都合よく増やす
  - ほどくべき誓いを恐れだけで抱え続ける
  - 境界を越えた理由だけで戻る権利を奪う
  - 門を守る者だけに内側の規則を決めさせる
  - 立ち入り禁止を危険ではなく身分の印にする
  - 住む場所を離れた人の帰還を永遠に拒む
  - 道の途中にある場所を誰のものかで囲う
  - 人の境界と土地の境界を同じ線で管理する
  - 見えない線を知らない者にだけ罰として示す
  - 共有地を使う順番で人の価値を決める
  - 境目に立つ人へどちらか一方を選ばせる
  - 境界を越える知識だけを禁じて理由を隠す
  - 内側の安全のため外側の苦痛を見えなくする
  - 境界の変化を古い地図だけで否定する
  - どこにも属さない人を危険そのものと呼ぶ
  - 身体の同意なしに触れてよい範囲を決める
  - 他者の部屋を安心の名で監視し続ける
  - 遠くの出来事だから責任の外だと決める
  - 境界を越えた者の話を聞かずに追い返す
  - 境目を守るため中にいる者の移動を止める
  - 変化した関係へ昔の距離を強制する
  - 戻れる道を残さず選択を永遠の断絶にする
