items:
  - 音のない境界に囲まれた、記憶を保管する集落
  - 潮の満ち引きで道が変わる、低い石造りの街
  - 風向きによって入口の位置が変わる、孤立した工房
  - 昼夜の区別が薄く、灯りだけが時刻を示す市場
  - 使われなくなった施設が生活の場へ転用された地区
  - 互いの声が遠くまで届く、斜面に広がる居住地
  - 立ち入りの境界が季節ごとに移動する湿地
  - 古い観測設備を中心に営みが集まる高台
  - 道具の貸し借りで結ばれた、細い路地の町
  - 地下の空間と地上の広場が一つの生活圏をつくる場所
  - 霧が情報を隠し、標識の読み方が人ごとに違う場所
  - ものを置く場所によって、所有者の役割が変わる共同空間
