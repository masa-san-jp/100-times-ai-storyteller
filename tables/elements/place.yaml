items:
  - text: "風が谷を抜けるたび道幅の変わる斜面"
  - text: "雨水が地中を巡り足元の温度を変える平地"
  - text: "潮の流れが集落の入口を毎日動かす入江"
  - text: "地下の空洞に音だけが長く残る岩場"
  - text: "根の絡まりが歩ける場所を選別する森"
  - text: "乾いた川床に季節だけ水が戻る窪地"
  - text: "雲の高さで遠景の見え方が変わる高原"
  - text: "土の色が境界の位置を知らせる畑地"
  - text: "霧が谷底を隠し声だけを運ぶ盆地"
  - text: "地熱で足元の雪が帯状に消える斜面"
  - text: "生き物の通り道が人の道を迂回させる草地"
  - text: "崩れた地層が階段のように連なる崖"
  - text: "夜だけ水面に渡れる細い浅瀬"
  - text: "光を蓄える石が周囲の生態を変える洞穴"
  - text: "風向きで砂の丘が入口を塞ぐ荒地"
  - text: "流れの違う水が混ざらず並ぶ湿原"
  - text: "地面の振動が遠くの活動を伝える台地"
  - text: "季節ごとに安全な足場が移る氷原"
  - text: "岩の隙間から低い音が続く海辺"
  - text: "高低差が会話の届く距離を決める谷間"
  - text: "屋根の高さが通行の優先を示す密集した街区"
  - text: "使われるたび形を変える共同の作業場"
  - text: "壁の厚さで外の時間が遠く感じられる住居"
  - text: "水路と床面が一体になった市場の通路"
  - text: "役目を終えた施設を住まいへ改造した建物"
  - text: "明かりの配置が人の流れを誘導する広場"
  - text: "道具の貸し出し窓口が中心にある集落"
  - text: "音を遮る仕切りで区切られた会議所"
  - text: "修理の跡が建物の履歴として残る工房"
  - text: "使う人ごとに入口の高さが変わる倉庫"
  - text: "地下と地上をゆるく結ぶ段差の多い居住区"
  - text: "雨を集める屋根が生活の中心になる家並み"
  - text: "共有の壁に各世帯の記号が刻まれた通り"
  - text: "移動する床が部屋の用途を入れ替える施設"
  - text: "見張る場所と隠れる場所が隣り合う門前"
  - text: "風を通す穴が室内の温度を調整する塔"
  - text: "壊れた設備を残したまま暮らす再利用地区"
  - text: "物の置き場所が身分ではなく役割を示す倉庫"
  - text: "道路の一部が時間帯で作業場になる商業区"
  - text: "外からの音だけを選んで通す共同住宅"
  - text: "立つ位置で見える範囲が変わる薄い柵"
  - text: "触れると温度が変わり通行を知らせる門"
  - text: "土地の色だけで内外を分ける見えない境目"
  - text: "水面の幅が季節によって通行を許す境界"
  - text: "片側からだけ開く狭い通路の出口"
  - text: "声を出さないと通れない暗い検問所"
  - text: "境界の両側で異なる時間を刻む回廊"
  - text: "誰かの記憶だけが入口を示す空地"
  - text: "近づくほど景色の遠近が崩れる柵際"
  - text: "所有者でなく利用者が開け方を決める扉"
  - text: "内側の声が外へ漏れない厚い布の境"
  - text: "足跡が残った時だけ現れる臨時の道"
  - text: "目印を置くと位置が変わる境界標"
  - text: "戻る人にだけ狭くなる門の前"
  - text: "共有の水場と私有の土地をつなぐ段差"
  - text: "表裏で別の規則が掲示された入口"
  - text: "通るたびに名前を聞かれる橋のたもと"
  - text: "光の色で時間帯ごとの通行域を分ける通路"
  - text: "境目に置かれた物が持ち主を変える空間"
  - text: "立入の理由を説明するまで進めない坂道"
  - text: "乗り物の速度より待ち時間が重要な街道"
  - text: "流れに乗る者と逆らう者が交差する水路"
  - text: "道を選ぶたび出会う人が変わる分岐路"
  - text: "荷物の重さで通行料が変わる吊り橋"
  - text: "一度に一人しか渡れない長い足場"
  - text: "休む場所の間隔が旅の速さを決める街道"
  - text: "風の向きだけを頼りに進む移動路"
  - text: "途中で道具を交換する仕組みの遊歩道"
  - text: "夜になると別の入口へつながる地下道"
  - text: "道の状態を歩いた人が次の人へ伝える道"
  - text: "移動する家が停まる場所だけ生まれる広場"
  - text: "遠回りするほど安全になる斜面の道"
  - text: "足音の反響で進行方向を確かめる通路"
  - text: "橋を渡る順番が共同体の役割を示す水辺"
  - text: "道中の景色が過去の記憶を呼び起こす回廊"
  - text: "移動の許可が物ではなく時間に結びつく門"
  - text: "人の流れを止めずに荷を受け渡す乗換場"
  - text: "目的地より同行者が変わることに意味がある道"
  - text: "道の終点で来た理由を問い直される停留地"
  - text: "地図にない道を利用者の合図でつなぐ路地"
  - text: "湿った空気に遠くの火の匂いが混じる谷"
  - text: "床の振動が建物の外の動きを伝える部屋"
  - text: "光が少し遅れて届く静かな中庭"
  - text: "声の高さで空間の広さが変わって聞こえる廊下"
  - text: "手触りの違う壁が出口の方向を教える地下室"
  - text: "風の温度だけが時刻を知らせる見晴らし台"
  - text: "匂いの流れが人の集まりを示す市場"
  - text: "音のない雨が視界だけを白くする通り"
  - text: "触れた物の記憶が床の材質に残る部屋"
  - text: "近くの音ほど遅れて聞こえる広い空間"
  - text: "光の届かない場所で色だけが浮かぶ池"
  - text: "季節の匂いが建物ごとに違う路地"
  - text: "目を閉じると高低差がわかる階段"
  - text: "声を出すと壁の内部から返事が戻る洞窟"
  - text: "皮膚に当たる風で見えない流れを知る丘"
  - text: "ものの味が置かれた時間を伝える食卓"
  - text: "足元の熱が地中の空洞を知らせる床"
  - text: "遠い光の点滅が近くの変化を予告する窓"
  - text: "無音の区画で自分の心拍だけが響く室内"
  - text: "人の気配が消えると色の見え方が変わる広場"
