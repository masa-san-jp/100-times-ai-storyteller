items:
  - text: "思春期前"
    source: "Prepubescent"
  - text: "十歳前後"
    source: "Preteen"
  - text: "十代前半"
    source: "Early teens"
  - text: "十代後半"
    source: "Late teens"
  - text: "二十代前半"
    source: "Early twenties"
  - text: "二十代後半"
    source: "Late twenties"
  - text: "三十代"
    source: "In their thirties"
  - text: "四十代"
    source: "In their forties"
  - text: "五十代"
    source: "In their fifties"
  - text: "六十代"
    source: "In their sixties"
  - text: "七十代"
    source: "In their seventies"
  - text: "九十歳を超えている"
    source: "Over ninety"
  - text: "何世紀も生きているが、十歳に見える"
    source: "Centuries old but looks ten"
  - text: "生まれたばかりで、三日しか経っていない"
    source: "Newly created, three days old"
  - text: "年齢が逆戻りしており、現在は若い成人である"
    source: "Ages backwards, currently a young adult"
  - text: "二百年間、十九歳のまま凍結されている"
    source: "Frozen at nineteen for two hundred years"
