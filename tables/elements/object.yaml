items:
  - text: "触れた人の迷いだけを映す、薄い記録板"
  - text: "失われた約束の一部だけを保つ、欠けた器"
  - text: "持ち主が変わるたびに重さを変える鍵"
  - text: "一度だけ遠くの声を届ける、折り畳まれた筒"
  - text: "使う人の記憶を少しずつ消す、古い道具"
  - text: "二人の決断を同時に刻む、割れない石片"
  - text: "誰も完成させられない、余白の多い地図"
  - text: "夜になると隠れた線が浮かぶ、布の標識"
  - text: "返却されるまで音を発し続ける、小さな容器"
  - text: "過去の持ち主の手順だけを再生する、組み立て玩具"
  - text: "使い道を決めた者の名前を消す、無記名の札"
  - text: "失った場所の方向だけを指し続ける、鈍い針"
  - text: "触れた順序だけを保存する薄い記録板"
  - text: "書いた人の迷いが空白として残る紙片"
  - text: "誰にも読めない傷の並びで日付を示す札"
  - text: "使われた場所の温度を記憶する小さな容器"
  - text: "消えた声の波形だけを保つ巻物"
  - text: "持ち主ではなく見た人を記録する鏡"
  - text: "触れるたび違う断片を返す古い帳面"
  - text: "失われた道具の使い方を影で示す図"
  - text: "破られるまで温度を保つ小さな指輪"
  - text: "二人の息がそろった時だけ開く箱"
  - text: "守る条件を書き換えるたび重くなる板"
  - text: "返事のない約束も消さずに残す糸束"
  - text: "片方だけが読める誓いを隠した封筒"
  - text: "約束の期限を持ち主ではなく季節で示す紐"
  - text: "渡した相手が変わると文字が薄くなる札"
  - text: "言葉より先に結び目がほどける包み"
  - text: "交わした約束の数だけ穴が増える器"
  - text: "破る理由を記録してから切れる紙片"
  - text: "返す時期を決めずに預けられる鍵"
  - text: "約束を守った人の手元へ戻る小石"
  - text: "言い直した言葉だけを残す細長い板"
  - text: "誓いを聞いた者の影を映す小さな面"
  - text: "同じ条件を別々の文字で刻んだ札"
  - text: "守る人が変わるたび表面が温かくなる布"
  - text: "一度だけ撤回の言葉を受け入れる容器"
  - text: "約束を忘れた日だけ音を出す留め具"
  - text: "ふたりの距離が離れるほど長くなる紐"
  - text: "誰の所有にもならず誓いだけを保つ石"
  - text: "道を選んだ回数だけ目盛りが動く小さな車輪"
  - text: "触れた方角へゆっくり向きを変える針"
  - text: "使った人の歩幅を記憶する軽い靴底"
  - text: "移動した距離ではなく待ち時間を測る砂器"
  - text: "遠回りした道だけを明るく示す札"
  - text: "乗り換えた場所の音を順番に鳴らす笛"
  - text: "置く場所を変えると帰路を示す布地図"
  - text: "ひとり分の重さだけ浮く運搬具"
  - text: "進んだ道を消しながら新しい線を描く棒"
  - text: "誰かと並んだ時だけ進行方向が現れる板"
  - text: "道の傾きに合わせて形を変える杖"
  - text: "通った人の数で幅が変わる仮設橋"
  - text: "帰る方向だけを忘れない小さな灯り"
  - text: "運ぶ物の目的地を持ち主に問い返す荷札"
  - text: "旅の途中で用途が変わる折り畳み器具"
  - text: "遠くの仲間へ移動の合図を返す振り子"
  - text: "地図にない道へ近づくと震える盤"
  - text: "使い手の速度に合わせて重さを変える袋"
  - text: "行き先ではなく同行者を記録する通行札"
  - text: "置いた場所から一歩分だけ先へ移る石"
  - text: "失った物の空白だけを囲う木枠"
  - text: "持ち主の記憶が薄れるほど透明になる布"
  - text: "片方をなくすと残った方が重くなる耳飾り"
  - text: "返せなかった物の名前を内側に刻む箱"
  - text: "なくなった日だけ欠ける円形の札"
  - text: "失われた声を聞いた人の数だけ線が増える板"
  - text: "置き忘れた場所の方向を示し続ける鈍い針"
  - text: "失った関係の距離を結び目で表す紐"
  - text: "もう戻らないものを一度だけ包める紙"
  - text: "持ち主を失うと役目を問い直す道具"
  - text: "空になった器の底に最後の手触りを残す"
  - text: "失った時間の使い道だけを映す砂時計"
  - text: "誰にも見つからない喪失を音のない鈴にする"
  - text: "返らない返事を受け取った日を示す札"
  - text: "失われた場所の輪郭だけを保つ布地図"
  - text: "思い出せない物の重さを代わりに測る秤"
  - text: "なくした約束の条件を一つだけ残す封"
  - text: "消えた人の歩幅を床へ一度だけ写す板"
  - text: "失ったものを所有せずに弔うための器"
  - text: "片方の記憶が欠けると模様が変わる石"
  - text: "触れるたび表面の模様が別の形になる球"
  - text: "使う人の決断で用途が一つずつ増える道具"
  - text: "古い傷を隠すほど新しい線が現れる板"
  - text: "持ち主の手入れで硬さが変わる木片"
  - text: "昼と夜で内側の空間が入れ替わる箱"
  - text: "置かれた場所の規則を取り込む小さな札"
  - text: "壊れるたび別の結び方を示す留め具"
  - text: "読む人の問いに合わせて余白が変わる帳面"
  - text: "触れた人の関係を一時的に結び直す糸"
  - text: "同じ形を保ちながら意味だけ変わる面"
  - text: "温度の変化で隠れていた用途が浮かぶ器"
  - text: "過去の持ち主の手順を新しい手へ移す玩具"
  - text: "使わない時間が長いほど軽くなる鍵"
  - text: "一度捨てられると別の場所で役割を得る札"
  - text: "直した跡が新しい機能として残る道具"
  - text: "変化した環境に合わせて大きさを変える布"
  - text: "失敗した使い方を次の持ち主へ知らせる板"
  - text: "二つの物を合わせると違う履歴を語る石"
  - text: "誰かの選択を受けて色の意味が変わる紐"
  - text: "役目を終えた後に別の始まりを示す容器"
