roles:
  - id: protagonist
    name: 主人公
    definition: 物語の中心人物であり、冒険と試練を通じて成長し、変化する存在。内的および外的な葛藤を克服することで、自己実現や世界への貢献を果たす。
  - id: messenger
    name: 使者
    definition: 主人公に知恵や助言を与え、冒険への一歩を踏み出すきっかけを作る存在。成長のための方向性や目的意識を提供する。
  - id: supporter
    name: 支援者
    definition: 主人公をサポートしたり試練を通じて成長を促す。時に助け、時に混乱をもたらしながら新たな視点や気づきを与える存在。
  - id: adversary
    name: 敵対者
    definition: 主人公が克服すべき外的・内的な障害や敵対者。英雄の成長を試す存在であり、恐怖、誘惑、葛藤を象徴する。
  - id: bystander
    name: 傍観者
    definition: 主人公の選択や変化を目撃し、世界や共同体の反応を示す存在。直接対立せずとも、見届けることや沈黙によって結果に影響する。
