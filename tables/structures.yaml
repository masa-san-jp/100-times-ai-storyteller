  anticlimax:
    stages:
      - id: expectation
        name: 期待の提示
        definition: 何かが起こるという予感を日常の中に置く。
        guidance: 約束、知らせ、変化の兆しを一つ置く。大きな出来事は起こさず、待つ理由を具体的にする。
        act: 1
        weight: 1
        roles: [protagonist]
        absent_role_note: 主人公が不在なら、中心人物の待機を場の様子として示す。
