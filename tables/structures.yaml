  documentary-essay:
    stages:
      - id: record-opening
        name: 記録の開始
        definition: 観察の対象と目的を、日付と場所のある記録として示す。
        guidance: 事実を先に置く。観察の動機と範囲を述べ、語り手の位置を明確にする。
        act: 1
        weight: 1
        roles: [protagonist]
        absent_role_note: 主人公が不在なら、記録者の視点を資料の来歴として示す。
        world_sections: [place, customs, media]
        object: false
        climax: false
      - id: record-observation
        name: 観察の積み重ね
        definition: 観察と証言を重ね、事実の間の矛盾や共通点を拾う。
        guidance: 具体的な観察、証言、物証を順に並べる。解釈は短く挟み、事実と解釈を区別する。
        act: 2
        weight: 3
        roles: [supporter, adversary]
        absent_role_note: 支援者または敵対者が不在なら、残された資料や痕跡が証言の役割を担う。
        world_sections: [people, observation, past_events]
        object: true
        climax: false
      - id: record-reflection
        name: 考察の結び
        definition: 集めた観察から考察を引き出し、結論を断定せずに記す。
        guidance: 観察の中から一つの主題を取り出し、残る問いを示す。事実と考察を分けて締める。
