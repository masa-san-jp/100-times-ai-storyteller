        definition: 出来事が起こらないまま、日常と待機が続く。
        guidance: 小さな動作、会話、天候を繰り返す。緊張をほのめかして解消し、決定的な行動を避ける。
        act: 2
        weight: 4
        roles: [supporter, adversary]
        absent_role_note: 支援者または敵対者が不在なら、時間の経過や環境の変化が主人公の待機を支える。
