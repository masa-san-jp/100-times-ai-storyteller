  - id: observation
    name: 観測
    definition: 人々が世界の法則を感覚や道具で捉え、予測し、説明する方法を描く。
    viewpoints:
      - sensory_input（感覚入力）
      - measurement_devices（測定装置）
      - predictive_models（予測モデル）
      - explanatory_theories（説明理論）
      - 感覚が現象をどのように受け取るか
