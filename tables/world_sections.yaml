  - id: past_events
    name: 過去の出来事
    definition: 現在の制度、関係、信念に強い影響を残した過去の出来事を個別の項目として描く。
    viewpoints:
      - 有史以来の最重要イベントを10件から規模に応じた件数で生成する
      - event_name（イベント名）
      - approximate_date（おおよその時期）
      - description（詳細な説明、200〜300文字）
      - impact（世界への影響）
      - 現在の状況を形づくった転機
      - 出来事を記録し、語り継ぐ方法
      - 記憶の違いが生む対立や未解決の傷
    level: 3
    kind: list
    max_chars: 400
    prerequisites: [events, media]
    fact_schema:
      有史以来の最重要イベントを10件から規模に応じた件数で生成する: &id006
        type: object
        additionalProperties: false
        required:
        - facts
        - glossary
        properties:
          facts:
            type: array
            minItems: 1
            maxItems: 6
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - value
              - unit
              - year
              - calendar
              - count
              - composition
              - affiliation
              - cause
              - result
              properties:
                name:
                  type: string
                  pattern: \S
                  description: この観点の地点・制度・出来事・集団・指標の名前
                value:
                  type: number
                  description: 観点に対応する測定値・規模・割合。曖昧な程度語は使わない
                unit:
                  type: string
                  pattern: \S
                  description: 測定値の単位（km²、m、km、℃、mm、人、%、日など）
                year:
                  type: integer
                  description: 測定・成立・発生・予測の年（物語の暦）
                calendar:
                  type: string
                  pattern: \S
                  description: 年の基準になる暦の名前
                count:
                  type: integer
                  minimum: 0
                  description: 地点・構成員・事例・項目の件数
                composition:
                  type: string
                  pattern: \S
                  description: 構成・内訳
                affiliation:
                  type: string
                  pattern: \S
                  description: 所属・関係する地点や集団
                cause:
                  type: string
                  pattern: \S
                  description: 出来事の原因
                result:
                  type: string
                  pattern: \S
                  description: 出来事の結果
          glossary:
            type: array
            maxItems: 6
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - reading
              - kind
              - definition
              properties:
                name: &id005
                  type: string
                  pattern: \S
                reading: *id005
                kind: *id005
                definition: *id005
      event_name（イベント名）: *id006
      approximate_date（おおよその時期）: *id006
      description（詳細な説明、200〜300文字）: *id006
      impact（世界への影響）: *id006
      現在の状況を形づくった転機: *id006
      出来事を記録し、語り継ぐ方法: *id006
      記憶の違いが生む対立や未解決の傷: *id006
