  - id: media
    name: 記録の媒体
    definition: 経験、観測、解釈を身体や物質や信号に残し、誰かへ渡す媒体を描く。
    viewpoints:
      - biological（生体媒体、記憶、口伝）
      - static_engraved（静的刻記媒体、石碑、彫刻）
      - static_written（静的筆記媒体、紙、羊皮紙）
      - analog_signal（アナログ信号媒体、音声、映像）
      - digital（デジタル媒体、コンピュータ、ネットワーク）
      - 生体媒体の特性：不可視、超高密度、低速の読み書き、複製劣化あり
      - 静的刻記媒体・静的筆記媒体の特性：可視、長期保存、容量は面積依存
      - アナログ信号媒体の特性：不可視、波形の忠実保存、高速、複製劣化あり
      - デジタル媒体の特性：不可視、高密度、複製劣化なし、高速、機器依存
      - 媒体の可視性、密度、読み書き速度、複製劣化、機器依存性
      - 身体や記憶が記録をどう保持するか
      - 刻印や文字が情報をどう固定するか
      - 音やその他の媒体が記録をどう伝えるか
