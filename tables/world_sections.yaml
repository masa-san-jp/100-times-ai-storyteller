  - id: events
    name: 世界の法則
    definition: 宇宙と自然に働く法則が時空、相互作用、エネルギー、大地、気候、生態系をどう形づくるかを描く。
    viewpoints:
      - spacetime（時空間の構造）
      - interactions（相互作用）
      - quantum_fields（量子場）
      - entropy（エントロピー、情報量）
      - crustal_movement（地殻変動）
      - surface_structure（地表構造、地表の成分）
      - ecosystem（生態系）
      - 時空・相互作用・エネルギーと秩序の関係
      - 大地・気候・生態系の成り立ちと変動
    level: 3
    kind: single
    max_chars: 400
    prerequisites: [place]
    fact_schema:
      spacetime（時空間の構造）: *id002
