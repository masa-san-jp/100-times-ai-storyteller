sections:
  - id: place
    name: 場の描写
    definition: 物語の人物が行動する場所の感覚、地形、気候、境界、資源、危険を描く。
    viewpoints:
      - 地形・気候・光・音・匂いなど、人物が感じる環境
      - 人物の行動を可能にする境界、規則、資源、危険
    level: 0
  - id: customs
    name: 生活風習
    definition: 日々の暮らしで共有される習慣、価値観、公共への貢献、軋轢を描く。
    viewpoints:
      - 公共への貢献と見なされる行動
      - 重要視される文化や思想
      - 習慣の違いから生じる軋轢や緊張
    level: 1
  - id: people
    name: 人々
    definition: 世界で暮らす人々の役割、行動指針、個人的な問題と関係性を描く。
    viewpoints:
      - 社会における役割と日常の行動
      - 人々が重要視する行動指針
      - 個人的な問題と他者との関係
    level: 1
  - id: organizations
    name: 組織体
    definition: 組織が目指す理想、構成、施設や設備、抱える課題を描く。
    viewpoints:
      - 組織が指向する理想像
      - 構成要素、施設、設備、資源
      - 組織が抱える課題と内部の緊張
    level: 2
  - id: social_structure
    name: 社会構造
    definition: 社会の発展の方向、秩序を維持する仕組み、大きな課題と阻害要因を描く。
    viewpoints:
      - 社会が向かう発展の方向性
      - 構造や秩序を維持する仕組み
      - 社会全体の課題と発展を阻む要因
    level: 2
  - id: past_events
    name: 過去の出来事
    definition: 現在の制度、関係、信念に強い影響を残した過去の出来事と記憶を描く。
    viewpoints:
      - 現在の状況を形づくった転機
      - 出来事を記録し、語り継ぐ方法
      - 記憶の違いが生む対立や未解決の傷
    level: 3
  - id: future
    name: 未来の可能性
    definition: 現在の選択から生じうる複数の未来と、その可能性を左右する条件を描く。
    viewpoints:
      - 現在の選択が開く望ましい未来
      - 失敗や停滞から生じる未来
      - 未来を変えるために必要な行動と代償
    level: 4
