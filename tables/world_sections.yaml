sections:
  - id: place
    name: 場の描写
    definition: 物語の人物が行動する場所の感覚、地形、気候、境界、資源、危険を描く。
    viewpoints:
      - 地形・気候・光・音・匂いなど、人物が感じる環境
      - 人物の行動を可能にする境界、規則、資源、危険
      - 地形の種類・分布・標高
      - 気候パターン・気温・降水量
      - 自然資源（鉱物、森林、淡水）
      - 自然保全施策
      - 災害頻度とリスク
    level: 0
    kind: single
    max_chars: 400
    prerequisites: []
    fact_schema:
      地形・気候・光・音・匂いなど、人物が感じる環境: &id002
        type: object
        additionalProperties: false
        required:
        - facts
        - glossary
        properties:
          facts:
            type: array
            minItems: 1
            maxItems: 6
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - value
              - unit
              - year
              - calendar
              - count
              properties:
                name:
                  type: string
                  pattern: \S
                  description: この観点の地点・制度・出来事・集団・指標の名前
                value:
                  type: number
                  description: 観点に対応する測定値・規模・割合。曖昧な程度語は使わない
                unit:
                  type: string
                  pattern: \S
                  description: 測定値の単位（km²、m、km、℃、mm、人、%、日など）
                year:
                  type: integer
                  description: 測定・成立・発生・予測の年（物語の暦）
                calendar:
                  type: string
                  pattern: \S
                  description: 年の基準になる暦の名前
                count:
                  type: integer
                  minimum: 0
                  description: 地点・構成員・事例・項目の件数
          glossary:
            type: array
            maxItems: 6
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - reading
              - kind
              - definition
              properties:
                name: &id001
                  type: string
                  pattern: \S
                reading: *id001
                kind: *id001
                definition: *id001
      人物の行動を可能にする境界、規則、資源、危険: *id002
      地形の種類・分布・標高: *id002
      気候パターン・気温・降水量: *id002
      自然資源（鉱物、森林、淡水）: *id002
      自然保全施策: *id002
      災害頻度とリスク: *id002
  - id: customs
    name: 生活風習
    definition: 日々の暮らしで共有される習慣、価値観、公共への貢献、軋轢を描く。
    viewpoints:
      - 公共への貢献と見なされる行動
      - 重要視される文化や思想
      - 習慣の違いから生じる軋轢や緊張
      - 社会的モラル
      - 公共空間のマナー
      - 公共での身体距離・プライバシー
      - 敬語・挨拶・謝罪文化
      - 贈答文化
      - 会食・接待の作法
      - 意見表明と沈黙・察しの文化
      - 言語体系・方言・文字体系の多様性
      - 習慣や伝統行事の頻度・形式
      - 文化的アイデンティティとその変遷
      - 文化資産の保存と普及度
      - 教育機関やメディアの影響度
    level: 1
    kind: single
    max_chars: 400
    prerequisites: [place]
