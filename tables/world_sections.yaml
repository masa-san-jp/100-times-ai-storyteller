  - id: social_structure
    name: 社会構造
    definition: 社会の発展の方向、秩序を維持する仕組み、大きな課題と阻害要因を描く。
    viewpoints:
      - 社会が向かう発展の方向性
      - 構造や秩序を維持する仕組み
      - 社会全体の課題と発展を阻む要因
      - 政治体制
      - 社会階層
      - 経済システム
      - 文化・宗教
      - 法律・治安
      - 教育・技術
      - 環境・生態系
      - インフラ・交通
      - 生活様式
      - コミュニケーション
      - 芸術・娯楽
      - その他の特徴
      - 国家体制：統治形態の種類、権力集中度や分権度、政策の安定性・変動性、国家間の連携・対立状況、国内の政治構造（議会、貴族院、軍事組織など）
      - 社会階層：階層の区分、社会流動性の度合い、経済・文化資源の分布と集中度、社会的信用・評価システム、階層間の交流および対立の様相
      - 通貨・交易：通貨の種類・価値安定性・インフレ率、交易ルート（主要ルート、障害要因、季節変動）、貿易品目と供給チェーン、取引頻度と市場参加者数、貿易規制や税制の影響
      - 生産・消費：各産業の生産能力（農業、工業、手工業）、資源分布と採取難易度、消費パターンと需要変動、労働力供給・賃金体系・雇用率、生産・流通コストと効率性
      - 言語・習慣：言語体系・方言・文字体系の多様性、習慣や伝統行事の頻度・形式、文化的アイデンティティとその変遷、文化資産の保存と普及度、教育機関やメディアの影響度
      - 宗教・信仰：宗教体系（多神教、一神教、精霊信仰）、教義・儀式・祭礼、信者数・拡散率・布教、宗教組織の構造・権威・資金源、宗教的禁忌・倫理規範
      - 法体系：厳格性・柔軟性・適用範囲、犯罪種類と頻度、裁判制度の構造・透明性・公平性、罰則・再犯率・改正履歴、法遵守意識
      - 治安維持：警察・衛兵・民兵の規模と装備、治安予算、犯罪予防の成熟度、市民の安全意識・通報システム、治安指標
      - 教育機関：種類（学校、図書館、師弟制度）と規模、カリキュラム・伝承方法・評価基準、学習者数・進学率、教育予算、制度の変遷
      - 技術レベル：科学技術の進歩指標、技術普及率、技術革新の影響度・持続性、産業別技術適用、政策・国際競争力
      - 自然環境：地形の種類・分布・標高、気候パターン・気温・降水量、自然資源（鉱物、森林、淡水）、自然保全施策、災害頻度とリスク
      - 動植物：生物種・固有種・絶滅危惧種、捕食・共生関係、季節変動、環境ストレス要因、生物多様性と保護
      - 交通手段：種類・頻度・速度・信頼性、交通網のカバレッジ、燃料効率・環境負荷、事故率・安全基準、運行コストと利用者数
      - インフラ整備：施設の種類・規模・耐用年数、維持管理コスト・故障率、普及率・地域格差、建設技術・材料品質、投資額・補助金
      - 住居・衣食：住居タイプ、建築様式・材料・設備、衣服のデザイン・素材・伝統衣装、食文化（主食、副菜、調理法、地域食材）、居住環境指標
      - 職業・労働：職業の種類と分布・経済貢献、労働時間・賃金・労働条件、職業訓練・スキル習得、需給バランス・失業率、労働組合・労働法規
      - メディア：種類・普及率・リーチ、発信速度・正確性・検証、報道の多様性・客観性、市民のアクセス、法的・自己規制
      - 通信手段：種類・普及率・伝達速度、コスト・インフラ・信頼性、セキュリティ・データ保護、カバレッジ・障害率、アップグレード周期・利用者数
      - 音楽・演劇：表現の種類・スタイル・ジャンル、文化イベントの頻度・規模、芸術家の育成・資金・評価、公共施設（劇場、ホール）、社会的評価・批評・文化政策
      - スポーツ・ゲーム：種類・ルール・競技システム、参加者数・観戦者数・経済効果、開催頻度・規模・運営、競技施設・安全基準、ルール改定・公正性
