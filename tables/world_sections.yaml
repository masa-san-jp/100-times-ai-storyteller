  - id: people
    name: 人々
    definition: 世界で暮らす人々の役割、属性、行動指針、個人的な問題と関係性を個別の項目として描く。
    viewpoints:
      - 社会における役割と日常の行動
      - 人々が重要視する行動指針
      - 個人的な問題と他者との関係
      - name（氏名）
      - age（年齢）
      - gender（性別）
      - residence（居住地）
      - family（家族構成）
      - affiliation（所属）
      - role（役割）
      - income（収入レベル）
      - lifestyle（ライフスタイル）
      - hobbies（趣味）
      - values（価値観）
      - goals（目標）
      - concerns（悩み）
      - relationships（人間関係）
      - 休日の過ごし方
      - 情報収集方法
      - 家族形態
      - 地域コミュニティ
      - ライフステージ
      - 社会的モラル
      - ジェンダー役割
      - 健康・衛生
      - 日常行動パターン
      - 家族形態：世帯構成の類型、血縁・婚姻関係と扶養責任の強度、家族内意思決定・家計管理、世代間交流・同居、近居率・介護分担、離婚・再婚・養子縁組の制度と受容
      - 地域コミュニティ：自治組織形態、参加率と自治活動（清掃・防災・祭礼）、互助ネットワークと資源共有、リーダー選出・合意形成、地域アイデンティティと外部流入者への開放度
      - 趣味・関心：コミュニティの規模と活動頻度、行動規範・モデレーション・ハラスメント対策、情報共有様式、維持・運営の資金源
      - ライフステージとライフイベント：出産施設・助産制度・出生登録、命名儀式・祝賀慣行、出生率、産後サポート、保育・幼児教育と就園率、遊び文化、友人関係形成、成長儀礼、成人年齢・通過儀礼、進学・就職・技能習得の分岐点、恋愛・デート文化とジェンダー規範、自立支援、危険行動・リスク教育、キャリア形成・昇進儀礼・表彰、住宅取得制度、家族内役割再編、健康管理、地域での社会的貢献活動、婚姻制度と手続、婚礼儀式の形式・費用・地域差、親族間の贈与・儀礼、離婚・再婚と子の監護権、妊産婦医療、乳幼児養育文化、親族・コミュニティの子育て支援、教育投資、退職制度・年金・再就職、介護形態、健康寿命、高齢者コミュニティ、家族間の介護分担、看取りと死後事務、葬儀形式、埋葬形態、香典・弔電・供花、相続、家族・親族間のプライバシー、家族・親族間の金銭管理
      - 社会的役割と地位付与：年功序列・長老制・高齢者敬重度、市民権・兵役・奉仕義務、引退儀礼・隠居文化、権威・資源の世代継承
      - ジェンダー役割：家事・育児・介護の分担、ジェンダー平等・法的保護、多様なジェンダーコミュニティの権利・認知、服飾・化粧・身体装飾の性差規範、差別事例・救済制度
      - 職業・専門家ステータス：資格・免許・学位の取得と難易度、専門職団体・ギルド・学会の権威、社会的信用・地位、功労章・表彰・叙勲、懲戒制度・職業倫理
      - 宗教・文化的役割：聖職者・巫女・行者の地位と任命儀式、文化財守人・家元・世襲芸能、年中祭礼の役割者、宗教階層の権限差、世襲・選挙・試験による地位付与
      - 住環境・生活インフラ：持家、賃貸比率・空き家率、上下水・エネルギー供給、外食・デリバリー文化
      - 健康・衛生・安全：医療アクセス、公衆衛生、生活安全
      - 日常行動パターン：平均労働時間・通勤時間、睡眠・家事・余暇時間、旅行・スポーツ参加、文化施設の利用、ボランティア・地域活動、消費・購買行動、決済方法、メディア接触頻度、遠隔地との交流
