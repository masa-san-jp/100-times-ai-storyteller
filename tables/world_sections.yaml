  - id: interpretation
    name: 解釈
    definition: 世界の法則と観測された現象に意味を与え、共同体が現実を理解する枠組みを描く。
    viewpoints:
      - mythological（神話伝承）
      - geometric_philosophical（幾何的・哲学的解釈）
      - empirical（経験主義的解釈、敬虔主義的解釈）
      - relativistic_quantum（相対論的・量子論的解釈）
      - informational_computational（情報・計算的解釈）
      - 神話・伝承が現象や起源をどのように語るか
      - 哲学や経験則が生き方と判断をどう導くか
      - 科学的説明が観測と予測をどう結びつけるか
    level: 2
    kind: single
    max_chars: 400
    prerequisites: [events, observation]
    fact_schema:
