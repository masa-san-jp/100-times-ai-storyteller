  - id: organizations
    name: 組織体
    definition: 組織が目指す理想、構成、施設や設備、抱える課題を描く。
    viewpoints:
      - 組織が指向する理想像
      - 構成要素、施設、設備、資源
      - 組織が抱える課題と内部の緊張
      - 社会的集団の構成員の種類と規模
      - 社会的集団の目的
      - 社会的集団の課題
      - 職業・所属集団：雇用形態、組織文化・上下関係・福利厚生、労働組合・業界団体の加入率と交渉力、異業種交流、地位付与・表彰制度
