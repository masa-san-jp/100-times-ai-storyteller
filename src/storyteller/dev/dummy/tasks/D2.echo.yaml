id: D2.echo
version: 2
kind: llm
element: text
output: text
inputs:
  item:
    label: 項目
    from: D1.items
    select: items[{slot}]
    required: true
card:
  role: 与えられた1件の項目について短い確認文を書く。
  steps:
    - 項目の text を使って短い確認文を書く。
validate:
  checks:
    - max_chars:
        n: 50
lease_minutes: 0.05
continuation: false
# 状態遷移の検査用：上限に達したら run を止める（task-model §6.3）。
on_exhausted: fail
