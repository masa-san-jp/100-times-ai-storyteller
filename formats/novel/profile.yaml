name: novel
unit: chapter
unit_mapping: structure
chars_per_event: [1500, 3000]
max_chars_per_task: 6000
template: template.md
continuation: true

rules:
  - 地の文と会話で書く。説明的な要約で済ませない。
  - 入力の出来事の順序を変えない。
  - 入力にない出来事・人物を加えない。
  - 登場人物の動機は、その人物の行動・台詞・内面で示す。動機を示すために、入力にない出来事を加えない。

checks:
  code: [min_chars, max_chars, ends_complete]
  llm:
    - kind: event_coverage
      question: 入力の出来事のうち、描かれていないものがありますか
      severity: error
    - kind: named_actor
      question: 入力にない人物が登場していますか
      severity: error
    - kind: condition_conflict
      question: 確定した筋の条件や入力の出来事にない発動・禁止・解決条件を加えたり、条件を反転・置換したりしているか？
      severity: error
    - kind: replay
      question: 同じ行動や結果を進展なく最初から語り直しているか？
      severity: advisory
