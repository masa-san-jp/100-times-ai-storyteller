name: novel
unit: chapter
unit_mapping: structure
chars_per_event: [1500, 3000]
max_chars_per_task: 6000
template: template.md
continuation: true

rules:
  - 地の文と会話で書く。説明的な要約で済ませない。
  - 入力の出来事の順序を変えない。
  - 入力にない出来事・人物を加えない。

checks:
  code: [min_chars, max_chars, ends_complete]
  llm:
    - 入力の出来事のうち、描かれていないものがありますか
    - 入力にない人物が登場していますか
    - 確定した筋の条件や入力の出来事にない発動・禁止・解決条件を加えたり、条件を反転・置換したりしているか？
    - 同じ行動や結果を進展なく最初から語り直しているか？
