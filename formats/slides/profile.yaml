name: slides
unit: slide
unit_mapping: per_event
chars_per_event: [300, 600]
max_chars_per_task: 1200
template: template.md
continuation: false

rules:
  - "1つの出来事を、1枚のスライドとして、次の形で書く。1行目は「# 」で始まる見出し（出来事を表す1行）。次に本文を1〜3行。最後に「<!--」と「-->」で囲んだスピーカーノート。"
  - 見出しと本文は短く書く。本文は箇条書き（「- 」で始まる行）でもよいが、3行を超えない。
  - スピーカーノートは、その出来事を語る原稿として、話し言葉の文で書く。説明的な要約で済ませない。
  - スライドの区切り（「---」だけの行）と、先頭の設定（front matter）を書かない。
  - 入力の出来事だけを扱い、入力にない出来事・人物を加えない。
  - スピーカーノートの中に「-->」を書かない。

checks:
  code: [min_chars, max_chars, marp_syntax]
  llm:
    - kind: event_coverage
      question: 入力の出来事のうち、描かれていないものがありますか
      severity: error
    - kind: named_actor
      question: 入力にない人物が登場していますか
      severity: error
    - kind: condition_conflict
      question: 確定した筋の条件や入力の出来事にない発動・禁止・解決条件を加えたり、条件を反転・置換したりしているか？
      severity: error
    - kind: replay
      question: 同じ行動や結果を進展なく最初から語り直しているか？
      severity: advisory
