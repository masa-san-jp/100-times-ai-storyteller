name: screenplay
unit: scene
unit_mapping: scene
chars_per_event: [300, 800]
max_chars_per_task: 2400
template: template.fountain
continuation: true

rules:
  - Fountain 形式でシーンの中身を書く。シーン見出し（行頭の「.」）、章・節の見出し（「#」）、タイトルページは書かない。
  - 状況と動きは、現在形の短い地の文（アクション）で書く。1段落ごとに空行を入れる。
  - 台詞は、行頭に「@」を付けた人物名の行、その直下に台詞の行、の形で書く。台詞の前後は空行にする。感情や仕草は、人物名の行と台詞の間、または台詞の行の間に、半角の丸括弧で囲んだ1行で示す。
  - 人物の内面は、行動と台詞で見せる。説明的な地の文で済ませない。
  - 入力の出来事の順序を変えない。
  - 入力にない出来事・人物を加えない。
  - 登場人物の動機は、その人物の行動・台詞・内面で示す。動機を示すために、入力にない出来事を加えない。

checks:
  code: [min_chars, max_chars, ends_complete, fountain_syntax]
  llm:
    - kind: event_coverage
      question: 入力の出来事のうち、描かれていないものがありますか
      severity: error
    - kind: named_actor
      question: 入力にない人物が登場していますか
      severity: error
    - kind: condition_conflict
      question: 確定した筋の条件や入力の出来事にない発動・禁止・解決条件を加えたり、条件を反転・置換したりしているか？
      severity: error
    - kind: replay
      question: 同じ行動や結果を進展なく最初から語り直しているか？
      severity: advisory
